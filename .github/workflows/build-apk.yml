name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Añadir plataforma Android
        run: cordova platform add android@12.0.1

      - name: Firma estable de CI (keystore debug persistente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.android /tmp/keys
          rm -f /tmp/keys/ci-debug.keystore
          if gh release download ci-keys --repo "$GITHUB_REPOSITORY" --pattern "ci-debug.keystore" --dir /tmp/keys && [ -s /tmp/keys/ci-debug.keystore ]; then
            cp /tmp/keys/ci-debug.keystore ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep SHA1 || true
            echo "RESULTADO: Keystore estable restaurado del release ci-keys (misma firma)"
          else
            echo "RESULTADO: NO se pudo restaurar el keystore — se genera uno NUEVO (cambia la firma: la app instalada pedira desinstalar)"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore /tmp/keys/ci-debug.keystore
            gh release view ci-keys --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create ci-keys --repo "$GITHUB_REPOSITORY" --title "Llave de firma CI (no instalar)" --notes "Keystore debug estable para que la actualizacion automatica conserve la firma y no pida desinstalar la app. NO BORRAR este release."
            gh release upload ci-keys --repo "$GITHUB_REPOSITORY" /tmp/keys/ci-debug.keystore --clobber
          fi

      - name: Instalar plugins locales
        run: cordova plugin add plugins-locales/cdp-notificaciones plugins-locales/cdp-contactos plugins-locales/cdp-widget plugins-locales/cordova-plugin-saf-mediastore plugins-locales/cdp-actualizador
        env:
          npm_config_ignore_scripts: 'true'

      - name: Instalar build-tools 33.0.2 y plataforma android-33
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;33.0.2" "platforms;android-33" > /dev/null

      - name: Compilar APK debug
        run: cordova build android --debug

      - name: Preparar artefacto
        run: |
          mkdir -p apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk apk/Gestor-de-Tareas-v1.9.1-debug.apk
          ls -la apk/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gestor-de-tareas-debug-apk
          path: apk/*.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1-ci
          name: Gestor de Tareas v1.9.1 (debug)
          body: |
            APK debug generada automáticamente por GitHub Actions.

            APK debug generada automáticamente por GitHub Actions.

            n1.9.1: revision visual completa (fondo y tarjetas planas Material 3, CSS
            duplicado fusionado, botones con iconos SVG de sistema) y el TABLERO
            (Kanban) ahora se mueve ARRASTRANDO la tarjeta con el dedo entre las
            tres columnas (tambien siguen los botoncitos y tocar abre los detalles).
          files: apk/*.apk
