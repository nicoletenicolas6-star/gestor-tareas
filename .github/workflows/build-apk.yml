name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Instalar Cordova
        run: npm install -g cordova@12

      - name: Añadir plataforma Android
        run: cordova platform add android@12.0.1

      - name: Instalar plugins locales
        run: cordova plugin add plugins-locales/cdp-notificaciones plugins-locales/cdp-contactos plugins-locales/cdp-widget plugins-locales/cordova-plugin-saf-mediastore
        env:
          npm_config_ignore_scripts: 'true'

      - name: Instalar build-tools 33.0.2 y plataforma android-33
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;33.0.2" "platforms;android-33" > /dev/null

      - name: Compilar APK debug
        run: cordova build android --debug

      - name: Preparar artefacto
        run: |
          mkdir -p apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk apk/Gestor-de-Tareas-v1.6.1-debug.apk
          ls -la apk/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gestor-de-tareas-debug-apk
          path: apk/*.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1-ci
          name: Gestor de Tareas v1.6.1 (debug)
          body: |
            APK debug generada automáticamente por GitHub Actions.

            Incluye las mejoras de la Agenda: buscador, completar desde la agenda,
            envío por WhatsApp y tareas recurrentes.

            Nota: al ser debug (sin el keystore de release), puede pedir instalarla
            como app aparte si ya tienes la versión firmada instalada.
          files: apk/*.apk
