<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Organizador de Tareas</title>
<style>
:root{
  --bg:#EEF1F6; --bg2:#E6EBF3; --tar:#FFFFFF; --chip:#E7ECF4; --inp:#FFFFFF;
  --txt:#0B1220; --sub:#5A6879; --pri:#1E5AE8; --pri2:#1243B0; --pri-soft:#DCE7FF; --pri-txt:#FFFFFF;
  --bor:#DCE3EC; --ok:#0B7A43; --ok-soft:#D7F0DF; --warn:#8A5200; --warn-soft:#FBE9C7;
  --peli:#B3261E; --peli-soft:#FBDBD7; --ind:#5E2CA5; --ind-soft:#EADFFA;
  --nav:#FFFFFF; --sombra:0 2px 14px rgba(16,32,64,.09); --sombra2:0 8px 28px rgba(16,32,64,.16);
}
html[data-tema=oscuro]{
  --bg:#070A10; --bg2:#0B0F17; --tar:#10151F; --chip:#1A2231; --inp:#0D121B;
  --txt:#E7ECF5; --sub:#8A97AB; --pri:#3B82F6; --pri2:#2F6FE0; --pri-soft:#16233A; --pri-txt:#FFFFFF;
  --bor:#1E2734; --ok:#3BBE63; --ok-soft:#122A1B; --warn:#E0A33A; --warn-soft:#2E2310;
  --peli:#F0574A; --peli-soft:#2E1512; --ind:#A882F0; --ind-soft:#201A33;
  --nav:#0C111A; --sombra:0 2px 14px rgba(0,0,0,.5); --sombra2:0 10px 30px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{max-width:min(960px,100%);margin:0 auto;min-height:100%;display:flex;flex-direction:column;width:100%}
button{font-family:inherit;cursor:pointer}
@media(min-width:760px){main{padding:20px 26px;padding-bottom:96px}}
/* barra superior PREMIUM: glassmorphism + degradado + sombra suave */
.cab{position:sticky;top:0;z-index:30;background:var(--nav);color:var(--txt);padding:10px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bor);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.cab .marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.cab .marca img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.25)}
.cab .marca b{font-size:17px;font-weight:900;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:13px;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s ease}
.icon-btn:active{background:rgba(255,255,255,.28);transform:scale(.94)}
.icon-btn .dot-n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;background:#FF4D4D;color:#fff;border-radius:999px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--pri);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cab .yo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.1));color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.2)}
main{flex:1;padding:14px;padding-bottom:96px}
main.aparece{animation:aparece .45s ease both}
@keyframes aparece{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
nav.tab{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--bor);display:flex;z-index:20;box-shadow:0 -2px 16px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom)}
nav.tab button{flex:1;background:none;border:none;color:var(--sub);padding:7px 0 9px;font-size:12px;min-height:48px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;letter-spacing:-.2px}
nav.tab button.on{color:var(--pri)}
nav.tab .ico{font-size:24px}
/* generales */
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin:18px 2px 8px;display:flex;align-items:center;gap:6px;font-weight:800}
h2.sec .h{margin-left:auto;font-weight:600;text-transform:none;letter-spacing:0;font-size:12px}
.tar{background:var(--tar);border-radius:16px;box-shadow:var(--sombra);padding:14px;margin-bottom:12px;border:1px solid var(--bor)}
.tar.tight{padding:4px 12px}
.lbl{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px;font-weight:700}
input,select,textarea{width:100%;background:var(--inp);color:var(--txt);border:1px solid var(--bor);border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.btn{display:block;width:100%;background:var(--btn1);color:#fff;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:800;margin-top:14px;box-shadow:0 2px 8px -4px var(--btn-shadow)}
.btn:active{opacity:.9;transform:translateY(1px)}
.btn.sec{background:var(--chip);color:var(--txt);box-shadow:none;border:1px solid var(--bor)}
.btn.ok{background:var(--ok);box-shadow:none}
.btn.dang{background:#B00020;box-shadow:none}
.btn.sm{width:auto;display:inline-block;padding:8px 12px;font-size:13px;margin:0;border-radius:10px}
.row{display:flex;gap:8px}
.row>*{flex:1}
/* swipe para eliminar */
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--bor)}
.swipe:last-child{border-bottom:none}
.swipe-del{position:absolute;inset:0;background:var(--peli);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-weight:800;font-size:13px;gap:6px;letter-spacing:.3px}
.swipe-prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--peli);z-index:3;box-shadow:0 0 6px rgba(255,80,60,.7)}
.tarea{position:relative;display:flex;align-items:flex-start;gap:10px;padding:11px 8px 11px 10px;background:var(--tar);border-left:4px solid var(--pri);transition:transform .18s ease;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.tarea.done{border-left-color:var(--sub)!important}
/* tarea */
.chk{width:28px;height:28px;min-width:28px;border:2.5px solid var(--sub);border-radius:9px;background:none;position:relative;margin-top:1px;flex-shrink:0;padding:0;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok);box-shadow:0 1px 5px -1px rgba(31,138,60,.6)}
.chk.on:after{content:"\2713";position:absolute;inset:0;color:#fff;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tarea .cuerpo{flex:1;cursor:pointer;min-width:0}
.tarea .tt{font-weight:700;line-height:1.3}
.tarea.done .tt{color:var(--sub);text-decoration:line-through}
.meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tipo{color:#fff;border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:800;letter-spacing:.2px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.badge .avatar{width:15px;height:15px;font-size:9px}
.b-ap{background:var(--pri);color:#fff}
.b-part{background:var(--chip);color:var(--txt)}
.badge.ind{background:var(--ind-soft);color:var(--ind)}
.badge.rec{background:var(--warn-soft);color:var(--warn)}
.badge.venc{background:var(--peli-soft);color:var(--peli)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.avatar{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
.avatar.av-foto{object-fit:cover;padding:0;display:block}
.borr{background:none;border:none;color:var(--sub);font-size:16px;padding:2px 4px;margin-top:1px}
.acc{display:flex;flex-direction:row;gap:6px;flex-shrink:0;align-items:center}
.acc button{width:36px;height:36px;border-radius:11px;border:none;font-size:16px;display:flex;align-items:center;justify-content:center}
.acc .ed{background:var(--chip);color:var(--pri)}
.acc .el{background:var(--peli-soft);color:var(--peli)}
.acc .sh{background:var(--ok-soft);color:var(--ok)}
.vacio{text-align:center;color:var(--sub);padding:22px 10px;font-size:14px}
/* filtros */
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.filtros button{background:var(--chip);border:none;color:var(--txt);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700}
.resp-chips button{display:inline-flex;align-items:center;gap:6px}
.det-f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--bor)}
.det-k{color:var(--sub);font-size:12.5px;font-weight:800}
.det-v{font-size:13.5px;font-weight:700;text-align:right;display:inline-flex;align-items:center;gap:6px}
.det-cuerpo{margin-top:6px}
.det-nota{font-size:13.5px;color:var(--txt);background:var(--chip);border-radius:10px;padding:9px 11px;margin-top:8px}
.filtros button.on{background:var(--pri);color:#fff}
/* chips de participantes */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips .vacio{font-size:12.5px;padding:2px 0}
.chip-p{display:inline-flex;align-items:center;gap:7px;background:var(--pri-soft);border:1.5px solid var(--pri);color:var(--pri);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;font-weight:700}
.chip-p button{border:none;background:rgba(30,90,232,.15);color:var(--pri);width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.lbl .n{font-weight:800;color:var(--pri)}
/* tipo selector */
.tipos{display:flex;gap:7px;margin-top:2px}
.tipos button{flex:1;border:1.5px solid var(--bor);border-radius:11px;padding:9px 4px;font-size:12.5px;font-weight:800;color:var(--txt);background:var(--tar);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.tipos button i{width:9px;height:9px;border-radius:50%;background:var(--tc);flex-shrink:0}
.tipos button.on{background:var(--tc);color:#fff;border-color:var(--tc);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tipos button.on i{background:#fff}
/* mic */
.campo-row{display:flex;gap:7px;align-items:stretch}
.campo-row input{flex:1}
.voz{width:48px;min-width:48px;border:none;border-radius:11px;background:var(--chip);font-size:20px;display:flex;align-items:center;justify-content:center}
.voz.on{background:var(--peli);color:#fff;animation:latir 1s infinite}
@keyframes latir{0%,100%{box-shadow:0 0 0 0 rgba(196,43,28,.5)}50%{box-shadow:0 0 0 8px rgba(196,43,28,0)}}
/* nota de voz */
.f-audio{margin-top:8px}
.f-audio .audio-prev{display:flex;align-items:center;gap:8px}
.f-audio .audio-prev audio{flex:1;height:34px}
.f-audio .grabando{display:flex;align-items:center;gap:8px;background:var(--peli-soft);color:var(--peli);border-radius:11px;padding:8px 10px;font-size:13px;font-weight:700}
.f-audio .grabando .dot{width:9px;height:9px;border-radius:50%;background:var(--peli);animation:latir 1s infinite;flex:0 0 auto}
.f-audio .btn.sm{margin:0;flex:0 0 auto}
/* formulario premium por secciones */
.form-prem{padding:15px}
.form-head{display:flex;align-items:center;gap:11px;margin-bottom:2px}
.form-head .fh-b{width:42px;height:42px;border-radius:14px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 6px 16px rgba(30,90,232,.3)}
.form-head .fh-t{flex:1;min-width:0}
.form-head .fh-t h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.2px}
.form-head .fh-t span{display:block;font-size:12px;color:var(--sub);margin-top:1px;line-height:1.35}
.form-sec{border-top:1px solid var(--bor);margin-top:14px;padding-top:12px}
.form-sec .fs-h{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.form-sec .fs-n{width:20px;height:20px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.form-sec .fs-h b{font-size:13.5px;font-weight:900;letter-spacing:.1px}
.form-sec .fs-x{margin-left:auto;font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;background:var(--chip);border-radius:999px;padding:2px 8px}
.form-prem .lbl{margin:9px 0 5px}
.form-prem .form-sec .fs-h+.lbl{margin-top:0}
.form-prem textarea{resize:vertical;min-height:64px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-row>div{min-width:0}
.field-row input{min-width:0}
.quick-dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.quick-dates button{border:1.5px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.quick-dates button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.quick-dates button:active{transform:scale(.96)}
/* selector de fecha y hora propio */
.pick-native{display:none}
.pick-field{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--bor);background:var(--tar);border-radius:14px;padding:10px 12px;text-align:left;color:var(--txt);transition:border-color .15s,background .15s}
.pick-field:active{transform:scale(.99)}
.pick-field .pf-i{width:34px;height:34px;border-radius:11px;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.pick-field .pf-t{flex:1;min-width:0}
.pick-field .pf-t small{display:block;font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
.pick-field .pf-t b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-field .pf-x{font-size:11.5px;font-weight:800;color:var(--pri);flex-shrink:0}
.pick-field.vacia .pf-t b{color:var(--sub);font-weight:700}
.pick-field+.pick-field{margin-top:8px}
/* hoja del selector */
.pick-sheet{max-height:92vh}
.pk-quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.pk-quick button{flex:1;border:1.5px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:11px;padding:9px 6px;font-size:12.5px;font-weight:800}
.pk-quick button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.pk-cal{margin-top:12px;background:var(--chip);border-radius:16px;padding:10px}
.pk-calh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pk-calh b{flex:1;text-align:center;font-size:13.5px;font-weight:900;text-transform:capitalize}
.pk-calh button{width:32px;height:32px;border:none;border-radius:10px;background:var(--tar);color:var(--txt);font-size:16px;font-weight:900}
.pk-dow,.pk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pk-dow span{text-align:center;font-size:10px;font-weight:800;color:var(--sub);padding:2px 0}
.pk-grid button{height:34px;border:none;border-radius:10px;background:transparent;color:var(--txt);font-size:13px;font-weight:700}
.pk-grid button:hover{background:var(--tar)}
.pk-grid button.out{opacity:.32}
.pk-grid button.hoy{box-shadow:inset 0 0 0 1.5px var(--pri)}
.pk-grid button.on{background:var(--pri);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.pk-time{margin-top:12px}
.pk-time.apagado .pk-wheels,.pk-time.apagado .pk-shortcuts{opacity:.35;pointer-events:none}
.pk-wheels{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;height:150px;margin-top:8px}
.pk-wheels:before{content:"";position:absolute;left:0;right:0;top:60px;height:30px;border-radius:10px;background:var(--pri-soft);pointer-events:none;z-index:0}
.pk-wheels:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--bor);opacity:.5}
.pk-col{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;position:relative;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:60px 0;overscroll-behavior:contain}
.pk-col::-webkit-scrollbar{display:none}
.pk-col button{display:block;width:100%;height:30px;line-height:30px;border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:700;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.pk-col button.on{color:var(--pri);font-weight:900;font-size:16px}
.pk-shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pk-shortcuts button{border:1px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800}
.pk-shortcuts button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.pk-dur{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:800;color:var(--sub)}
.pk-dur button{border:1px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.pk-dur button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.pk-acc{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--tar);padding-top:8px}
.pk-acc .btn{margin-top:0;flex:1}
.pk-acc .pk-quitar{flex:0 0 auto;background:var(--chip);color:var(--peli);border:none;border-radius:11px;padding:0 16px;font-size:13px;font-weight:800}
.pk-todo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-top:6px;cursor:pointer}
.pk-todo input{width:17px;height:17px;accent-color:var(--pri)}
/* recordatorios relativos */
.rec-rel{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 9px}
.rec-rel button{border:1px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800}
.rec-rel button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.hint{font-size:11.5px;color:var(--sub);margin:6px 0 0;line-height:1.45}
.switch{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;border:1px solid var(--bor);border-radius:11px;background:var(--chip);cursor:pointer;font-size:13.5px;font-weight:700;position:relative}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sw{width:38px;height:22px;border-radius:999px;background:var(--bor);position:relative;flex-shrink:0;transition:background .18s}
.switch .sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch input:checked+.sw{background:var(--pri)}
.switch input:checked+.sw:after{left:19px}
.switch .sw-t{flex:1;min-width:0}
.switch .sw-t small{display:block;font-weight:500;color:var(--sub);font-size:11.5px;margin-top:1px}
.recbox{margin-top:8px;padding:9px 10px 2px;border:1px dashed var(--bor);border-radius:12px;background:var(--chip)}
.recbox .lbl{margin-top:0}
.tel-card{display:flex;align-items:center;gap:9px;margin-top:8px;padding:8px 10px;border:1px solid var(--bor);border-radius:12px;background:var(--chip)}
.tel-card .tc-i{font-size:17px;flex-shrink:0}
.tel-card .tc-b{flex:1;min-width:0}
.tel-card .tc-l{font-size:10.5px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tel-card input{background:var(--tar);margin:0}
.form-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.linkbtn{background:none;border:none;color:var(--pri);font-size:12.5px;font-weight:800;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.linkbtn:active{opacity:.6}
.form-acc{margin-top:16px;position:sticky;bottom:8px;z-index:6;background:linear-gradient(180deg,transparent,var(--tar) 22%);padding:12px 0 4px;border-radius:12px}
.form-acc2{display:flex;gap:8px;margin-top:8px}
.form-acc2 .btn{margin-top:0;flex:1}
/* prioridad de la tarea */
.pri-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.pri-row>span{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.pri-chips{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.pri-chips button{flex:1 1 30%;min-width:88px;border:1.5px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:9px;padding:5px 4px;font-size:11.5px;font-weight:800}
.pri-chips button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.pri-chips button[data-pri=alta].on{background:var(--peli-soft);border-color:var(--peli);color:var(--peli)}
.nota-audio audio{width:100%;height:34px;margin-top:6px}
/* dashboard */
.hola{background:var(--pri-soft);color:var(--txt);border-radius:20px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:none;position:relative;overflow:visible}
html[data-tema=oscuro] .hola{background:transparent;border-radius:16px;padding:8px 2px 2px}
.hola:before,.hola:after{display:none}
.hola .k{font-size:12px;opacity:1;font-weight:700;letter-spacing:.12em;text-transform:uppercase;position:relative;color:var(--sub)}
.hola .t{font-size:27px;font-weight:900;margin-top:3px;letter-spacing:-.01em;position:relative;color:var(--txt)}
.hola .saludo{color:var(--pri)}
.hola .d{font-size:13px;opacity:1;margin-top:5px;text-transform:capitalize;position:relative;color:var(--sub)}
.progreso{display:flex;align-items:center;gap:18px;margin-top:16px;position:relative}
.ring{--p:0;position:relative;width:64px;height:64px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--bor) 0);display:flex;align-items:center;justify-content:center;box-shadow:none}
.ring .in{width:52px;height:52px;border-radius:50%;background:var(--tar);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txt);box-shadow:inset 0 0 0 1px var(--bor)}
.ring .in b{font-size:18px;font-weight:900;line-height:1}
.ring .in span{font-size:9.5px;opacity:.85}
.progreso .txt b{font-size:16.5px;letter-spacing:.2px}
.progreso .txt div{font-size:12.5px;opacity:1;margin-top:3px;color:var(--sub)}
/* tarjetas del dashboard PREMIUM */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stats .k{background:var(--tar);border:1px solid rgba(15,35,70,.055);border-radius:19px;padding:11px 12px;box-shadow:0 1px 2px rgba(15,35,70,.06);position:relative;user-select:none;touch-action:manipulation;cursor:grab;transition:transform .18s ease,box-shadow .18s ease,opacity .15s}
.stats .k .k-del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.12);color:var(--sub);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.stats .k.editable .k-del{opacity:1;transform:scale(1)}
.stats .k.dragging{opacity:.45;transform:scale(.95);box-shadow:0 12px 28px rgba(0,0,0,.22);z-index:5;cursor:grabbing}
.stats .k .k-ico{font-size:15px;margin-right:3px}
.stats .k b{font-size:24px;font-weight:900;display:block;line-height:1.05}
.stats .k span{font-size:11.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:3px}
.stats .k.cpri b{color:var(--pri)}.stats .k.cok b{color:var(--ok)}
.stats .k.cwarn b{color:var(--warn)}.stats .k.crojo b{color:var(--peli)}
.stats .k.cind b{color:var(--ind)}
.stats .k.manana b{color:var(--ind)}
.alerta{border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px}
.alerta.rojo{background:var(--peli-soft);color:var(--peli)}
.alerta.warn{background:var(--warn-soft);color:var(--warn)}
/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}
.calhead .mes{font-weight:900;font-size:20px;letter-spacing:.3px;text-transform:capitalize}
.calhead button{background:var(--chip);border:1px solid var(--bor);color:var(--txt);width:40px;height:40px;border-radius:12px;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .15s ease;box-shadow:var(--sombra)}
.calhead button:active{background:var(--pri);color:#fff;transform:scale(.94)}
.caldow,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.caldow div{text-align:center;font-size:11px;font-weight:800;color:var(--sub);padding:6px 0;text-transform:uppercase;letter-spacing:.5px}
.cel{aspect-ratio:1;min-height:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;position:relative;border:1.5px solid transparent;cursor:pointer;transition:all .15s ease;background:var(--tar);box-shadow:var(--sombra)}
.cel:active{transform:scale(.93)}
.cel.out{color:var(--sub);opacity:.35;background:transparent;box-shadow:none;cursor:default}
.cel.hoy{border-color:var(--pri);color:var(--pri);background:var(--pri-soft);font-weight:900}
.cel.sel{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:900;box-shadow:0 6px 18px rgba(30,90,232,.4)}
.cel .cnt{font-size:10px;font-weight:800;color:var(--sub);margin-top:2px}
.cel.sel .cnt{color:rgba(255,255,255,.85)}
.cel .pips{display:flex;gap:3px;justify-content:center;margin-top:3px;flex-wrap:wrap;max-width:90%}
.cel .pips i{width:6px;height:6px;border-radius:50%;display:inline-block}
.cel.sel .pips i{filter:brightness(1.3)}
.cal-mes-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-mes-row .badge-mes{background:var(--pri);color:#fff;border-radius:14px;padding:8px 16px;font-weight:900;font-size:14px;letter-spacing:.3px;box-shadow:0 4px 14px rgba(30,90,232,.35)}
.cal-mes-row .badge-anio{font-size:13px;color:var(--sub);font-weight:700}
.cal-leyenda{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bor)}
.cal-leyenda div{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);font-weight:600}
.cal-leyenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* agenda: cabecera, selector de vista y tiras de días */
.cal-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-top .ct-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cal-top .ct-m{font-size:19px;font-weight:900;letter-spacing:.2px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-top .ct-a{font-size:11px;color:var(--sub);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.cal-nav{display:flex;align-items:center;gap:5px;flex-shrink:0}
.cal-nav button{background:var(--chip);border:1px solid var(--bor);color:var(--txt);height:36px;min-width:36px;border-radius:11px;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 9px;line-height:1}
.cal-nav button:active{background:var(--pri);color:#fff;border-color:var(--pri)}
.cal-nav #cal-hoy{font-size:12px;padding:0 12px}
.cal-nav button:disabled{opacity:.4}
.cal-cuenta{font-size:12px;color:var(--sub);font-weight:700}
.cal-modos{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);border-radius:13px;padding:4px;margin-top:14px}
.cal-modos button{border:none;background:none;color:var(--sub);border-radius:10px;padding:8px 3px;font-size:12.5px;font-weight:800;transition:all .15s}
.cal-modos button.on{background:var(--tar);color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.13)}
.cal-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sem-d{position:relative;background:var(--tar);border:1.5px solid var(--bor);border-radius:12px;padding:7px 2px 7px;text-align:center;color:var(--txt);box-shadow:var(--sombra);line-height:1.15}
.sem-d b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);font-weight:800}
.sem-d span{display:block;font-size:16px;font-weight:900;margin-top:1px}
.sem-d i{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:transparent}
.sem-d.has i{background:var(--pri)}
.sem-d .n{position:absolute;top:3px;right:3px;min-width:14px;height:14px;padding:0 3px;border-radius:999px;background:var(--pri);color:#fff;font-size:8.5px;font-weight:900;display:flex;align-items:center;justify-content:center;font-style:normal}
.sem-d.hoy{border-color:var(--pri)}
.sem-d.hoy b,.sem-d.hoy span{color:var(--pri)}
.sem-d.sel{background:var(--pri);border-color:var(--pri);box-shadow:0 5px 14px rgba(30,90,232,.38)}
.sem-d.sel b,.sem-d.sel span{color:#fff}
.sem-d.sel i{background:#fff}
.sem-d.sel .n{background:#fff;color:var(--pri)}
.cal-agenda .cal-grupo{border-bottom:1px solid var(--bor);padding:9px 0 5px}
.cal-agenda .cal-grupo:last-child{border-bottom:none;padding-bottom:0}
.cal-gh{display:flex;align-items:center;gap:7px;margin:0 2px 7px}
.cal-gh .cgd{font-size:12.5px;font-weight:900;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-gh .cgn{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap}
.cal-gh .cgt{background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:1px 7px;font-size:10px;font-weight:900;flex-shrink:0}
.cg-add{width:24px;height:24px;border-radius:50%;border:none;background:var(--chip);color:var(--pri);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;line-height:1}
.cg-add:active{background:var(--pri);color:#fff}
.cal-grupo .cge{font-size:12px;color:var(--sub);padding:0 2px 5px}
.cal-vacio{text-align:center;padding:18px 8px}
.cal-vacio .cv-i{font-size:34px;line-height:1;margin-bottom:6px}
.cal-vacio b{display:block;font-size:15px;margin-bottom:2px}
.cal-vacio span{font-size:12.5px;color:var(--sub);line-height:1.4}
.cal-anio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal-mes{background:var(--tar);border:1.5px solid var(--bor);border-radius:13px;padding:11px 5px;text-align:center;color:var(--txt);box-shadow:var(--sombra)}
.cal-mes b{display:block;font-size:13.5px;text-transform:capitalize;font-weight:900}
.cal-mes span{display:block;font-size:10.5px;color:var(--sub);margin-top:2px;font-weight:700}
.cal-mes.tiene{border-color:var(--pri-soft);background:var(--pri-soft)}
.cal-mes.tiene span{color:var(--pri)}
.cal-mes.hoy{border-color:var(--pri);box-shadow:0 4px 14px rgba(30,90,232,.28)}
.cal-mes:active{transform:scale(.96)}
.cal-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cal-res>div{background:var(--chip);border-radius:12px;padding:10px 4px;text-align:center}
.cal-res b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.cal-res span{display:block;font-size:10px;color:var(--sub);font-weight:800;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.cel .pips{display:flex;gap:2.5px;position:absolute;bottom:4px}
.cel .pips i{width:5px;height:5px;border-radius:50%}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bor)}
.leyenda div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:600}
.leyenda i{width:11px;height:11px;border-radius:50%;display:inline-block}
/* rediseño de agenda: resúmenes, timeline del día y barras */
.cel.finde{background:var(--chip)}
.cel.semana-hoy{background:var(--pri-soft)}
.cel.hoy{background:var(--pri-soft)}
.cel .alta{position:absolute;top:3px;left:4px;font-size:8px;line-height:1}
.cal-mes-res{margin-top:10px;background:var(--chip);border-radius:12px;padding:9px 10px}
.cmr-bar,.cal-sem-prog{height:6px;border-radius:999px;background:var(--bor);overflow:hidden}
.cmr-bar i,.cal-sem-prog i{display:block;height:100%;background:var(--pri);border-radius:999px}
.cmr-k{display:flex;gap:10px;margin-top:7px;font-size:11px;color:var(--sub);font-weight:700}
.cmr-k b{color:var(--pri);font-size:12.5px}
.cmr-k span:last-child{margin-left:auto}
.cal-sem-prog{margin-top:10px}
.cal-dia-top{background:var(--tar)}
.cd-head{display:flex;align-items:center;gap:12px}
.cd-hl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cd-hl .cd-dow{font-size:11.5px;font-weight:900;color:var(--pri);text-transform:uppercase;letter-spacing:.5px}
.cd-hl b{font-size:34px;font-weight:900;line-height:.95;letter-spacing:-1px}
.cd-hl .cd-mon{font-size:12.5px;color:var(--sub);font-weight:700;text-transform:capitalize}
.cd-ring{--p:0;width:58px;height:58px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--chip) 0);display:flex;align-items:center;justify-content:center}
.cd-ring .in{width:46px;height:46px;border-radius:50%;background:var(--tar);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-ring b{font-size:12.5px;font-weight:900;line-height:1;color:var(--pri)}
.cd-ring span{font-size:7px;color:var(--sub);font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.cd-kpis{display:flex;gap:7px;margin-top:11px}
.cd-kpis span{flex:1;background:var(--chip);border-radius:10px;padding:7px 4px;text-align:center;font-size:10px;color:var(--sub);font-weight:700;line-height:1.2}
.cd-kpis b{display:block;font-size:15px;color:var(--txt);font-weight:900}
.cd-allday{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.cd-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bor);background:var(--tar);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--txt);max-width:100%}
.cd-chip .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cd-chip.hecha{opacity:.6;text-decoration:line-through}
/* check de "completar desde la agenda" (línea del día y chips de todo el día) */
.cd-chk{width:20px;height:20px;min-width:20px;border:2px solid var(--sub);border-radius:7px;background:none;position:relative;flex-shrink:0;padding:0;display:inline-block}
.cd-chk.on{background:var(--ok);border-color:var(--ok)}
.cd-chk.on:after{content:"\2713";position:absolute;inset:0;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.cd-chip .cd-chk{width:16px;height:16px;min-width:16px;border-radius:5px}
.cd-chip .cd-chk.on:after{font-size:10px}
.cd-tl{margin-top:4px}
.cd-hrow{display:grid;grid-template-columns:50px 1fr;gap:8px;min-height:46px;position:relative;border-top:1px solid var(--bor)}
.cd-hrow:first-child{border-top:none}
.cd-h{font-size:11px;font-weight:800;color:var(--sub);padding-top:10px;font-variant-numeric:tabular-nums}
.cd-hbody{position:relative;padding:5px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.cd-hrow[data-add-hora]{cursor:pointer}
.cd-hrow[data-add-hora]:active .cd-hbody{background:var(--pri-soft);border-radius:9px}
.cd-libre{font-size:11px;color:var(--sub);padding:8px 0;display:block}
.cd-hrow[data-add-hora] .cd-hbody:after{content:"＋";position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:900;color:var(--pri);opacity:0;transition:opacity .15s}
.cd-hrow[data-add-hora]:hover .cd-hbody:after{opacity:.55}
@media(hover:none){.cd-hrow[data-add-hora] .cd-hbody:after{opacity:.4}}
.cd-hrow.ahora{background:var(--pri-soft);border-radius:10px}
.cd-hrow.ahora .cd-h{color:var(--pri)}
.cd-hrow.ahora:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--pri)}
.cd-t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;text-align:left;border:1px solid var(--bor);border-left:3px solid var(--tc);background:var(--tar);border-radius:9px;padding:7px 9px;color:var(--txt);box-shadow:var(--sombra)}
.cd-t:active{transform:scale(.99)}
.cd-t .cd-dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex-shrink:0}
.cd-t .cd-tt{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cd-t .cd-sub{font-size:10.5px;color:var(--sub);font-weight:600;width:100%;padding-left:15px;margin-top:-2px}
.cd-t.hecha{opacity:.6}
.cd-t.hecha .cd-tt{text-decoration:line-through}
.cal-anio .cal-mbar{display:block;height:4px;border-radius:999px;background:var(--bor);margin-top:7px;overflow:hidden}
.cal-anio .cal-mbar i{display:block;height:100%;background:var(--pri);border-radius:999px}
.cal-anio .cal-mbar i.lleno{background:var(--pri)}
/* notificaciones */
.nof{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--bor);cursor:pointer}
.nof:last-child{border-bottom:none}
.nof .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.nof .cuerpo{flex:1;min-width:0}
.nof .tt{font-weight:700;font-size:14px}
.nof .sub{font-size:12px;color:var(--sub);margin-top:2px}
.resp-edit:last-child{border-bottom:none}
.resp-add{display:grid;grid-template-columns:1fr;gap:7px;background:var(--chip);border-radius:14px;padding:10px;margin-bottom:12px}
.resp-add input{width:100%;box-sizing:border-box}
.resp-add .fila2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.resp-edit{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bor)}
.resp-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.resp-info b{font-size:14.5px;line-height:1.25}
.resp-info span{font-size:12px;color:var(--sub)}
.resp-editbtn{flex-shrink:0;background:var(--pri-soft);color:var(--pri);border:none;border-radius:10px;width:34px;height:34px;font-size:15px;display:flex;align-items:center;justify-content:center}
.resp-fotowrap{position:relative;flex-shrink:0;line-height:0}
.resp-fotobtn{position:relative;border:none;background:none;padding:0;flex-shrink:0;line-height:0;border-radius:16px}
.resp-foto{width:52px;height:52px;border-radius:16px;object-fit:cover;background:var(--chip);display:block}
.resp-fotobtn .avatar{border-radius:16px}
.resp-x{position:absolute;top:-5px;right:-5px;width:21px;height:21px;border-radius:50%;background:var(--peli);color:#fff;border:2px solid var(--tar);font-size:11px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.resp-del{flex-shrink:0;background:var(--peli-soft);color:var(--peli);border:none;border-radius:10px;width:34px;height:34px;font-size:15px;display:flex;align-items:center;justify-content:center}
.resp-cargo{font-size:11.5px;color:var(--sub);font-weight:600}
/* crear responsable al vuelo (dentro del formulario de tarea) */
.resp-nuevo{display:none;margin-top:8px;padding:11px;border:1.5px dashed var(--bor);border-radius:13px;background:var(--chip)}
.resp-nuevo.on{display:block}
.resp-nuevo input{margin-bottom:7px;font-size:14px;padding:9px 11px}
.resp-nuevo .row{margin-top:2px}
.resp-nuevo .btn{margin-top:0;font-size:14px;padding:10px}
.resp-import{display:flex;align-items:center;gap:6px;margin-top:8px}
.resp-import button{background:var(--chip);border:none;color:var(--txt);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.resp-import .nota{font-size:11.5px;color:var(--sub)}
/* hoja de contactos */
.ct-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--tar);border:1px solid var(--bor);border-radius:12px;padding:10px 12px;margin-bottom:6px;text-align:left}
.ct-item b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-item span{font-size:12.5px;color:var(--sub);white-space:nowrap}
.ct-item:active{background:var(--chip)}
/* enviar tareas por responsable */
.env-volver{background:none;border:none;color:var(--pri);font-size:14px;font-weight:800;padding:2px 0;margin-top:8px}
.hoja-nota{font-size:12.5px;color:var(--sub);margin:0 0 2px;line-height:1.45}
.hoja-lista{max-height:56vh;overflow-y:auto;margin:0 -2px;padding:2px;overscroll-behavior:contain}
/* fila-lista (resumen que abre una hoja) */
.fila-lista{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--bor);padding:13px 14px;background:var(--tar);border-radius:16px;box-shadow:var(--sombra);margin-bottom:12px}
.fila-lista:active{background:var(--chip)}
.fila-lista .fl-ico{width:42px;height:42px;border-radius:13px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.fila-lista .fl-txt{flex:1;min-width:0}
.fila-lista .fl-txt b{font-size:14.5px;display:block}
.fila-lista .fl-txt span{font-size:12px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-lista .fl-n{background:var(--pri);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.grupo{background:var(--tar);border:1px solid var(--bor);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sombra)}
.grupo-cab{display:flex;align-items:center;gap:11px}
.grupo-cab .g-nm{flex:1;min-width:0}
.grupo-cab .g-nm b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grupo-cab .g-nm span{font-size:12px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grupo-acc{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.grupo-acc button{border:none;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:800;background:var(--chip);color:var(--txt)}
.grupo-acc button.send{background:var(--ok);color:#fff}
.grupo-tareas{margin-top:10px;border-top:1px solid var(--bor);padding-top:6px}
/* ayuda */
.ayuda h3{font-size:15px;margin:16px 0 5px;color:var(--pri)}
.ayuda p{font-size:13.5px;line-height:1.55;margin:0 0 8px}
.ayuda li{font-size:13.5px;line-height:1.5;margin-bottom:6px}
.ayuda .kv{background:var(--chip);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:13px}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay .sheet{background:var(--tar);width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:18px;max-height:86vh;overflow-y:auto;border-top:1px solid var(--bor)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--chip);margin:0 auto 12px}
.sheet h3{margin:0 0 6px;font-size:18px}
@media(min-width:681px){.overlay{align-items:center}.overlay .sheet{border-radius:18px;max-width:520px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#000;color:#fff;padding:10px 16px;border-radius:11px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:.94}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;animation:aparece .5s ease both}
#login .logo{text-align:center;margin-bottom:6px}
#login .logo img{width:72px;height:72px;border-radius:18px;box-shadow:var(--sombra2)}
#login h1{text-align:center;font-size:23px;margin:10px 0 2px}
#login p.sub{text-align:center;color:var(--sub);font-size:13px;margin:0 0 18px}
.usuarios-hab{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.usuarios-hab button{background:var(--chip);border:none;color:var(--txt);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
/* cargador */
.carga{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.42);backdrop-filter:blur(3px);transition:opacity .35s;pointer-events:none;opacity:1}
.carga.off{opacity:0}
.carga .card{background:var(--tar);border-radius:20px;padding:26px 30px 22px;box-shadow:var(--sombra2);display:flex;flex-direction:column;align-items:center;gap:12px;min-width:230px;border:1px solid var(--bor)}
.carga .txt{font-size:14px;font-weight:700;color:var(--txt);text-align:center}
.carga .puntos{display:flex;gap:6px}
.carga .puntos i{width:8px;height:8px;border-radius:50%;background:var(--pri);animation:punto 1.1s infinite ease-in-out}
.carga .puntos i:nth-child(2){animation-delay:.18s}.carga .puntos i:nth-child(3){animation-delay:.36s}
@keyframes punto{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.carga svg{width:150px;height:118px}
.hoja{fill:var(--tar);stroke:var(--bor);stroke-width:2}
.raya{stroke:var(--chip);stroke-width:4;stroke-linecap:round}
.tick{fill:none;stroke:var(--pri);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:64;stroke-dashoffset:64;animation:dibuja 1.9s ease-in-out infinite}
@keyframes dibuja{0%{stroke-dashoffset:64}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0}100%{stroke-dashoffset:64}}
.lapiz{animation:lapiz 1.9s ease-in-out infinite;transform-origin:center}
@keyframes lapiz{0%{transform:translate(46px,72px)}55%{transform:translate(78px,54px)}85%{transform:translate(78px,54px)}100%{transform:translate(46px,72px)}}
/* modal premium (confirmaciones) */
.modal{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease}
.modal .box{background:var(--tar);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:22px 20px 20px;box-shadow:var(--sombra2);border:1px solid var(--bor);animation:subir .28s cubic-bezier(.2,.8,.2,1);text-align:center}
@media(min-width:560px){.modal{align-items:center}.modal .box{border-radius:20px}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes subir{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal .mi{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px}
.modal .mi.warn{background:var(--peli-soft)}
.modal .mi.info{background:var(--pri-soft)}
.modal h4{margin:0 0 6px;font-size:19px;font-weight:900}
.modal p{margin:0 0 18px;font-size:14px;color:var(--sub);line-height:1.5}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1;border:none;border-radius:13px;padding:13px;font-size:15px;font-weight:800}
.modal .btns .mno{background:var(--chip);color:var(--txt)}
.modal .btns .msi{background:var(--peli);color:#fff}
.modal .btns .msi.pri{background:var(--pri)}
.modal .btns .msi.ok{background:var(--ok)}
/* estadísticas / gráficos */
.charts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.charts{grid-template-columns:1fr 1fr}}
.cha{background:var(--tar);border:1px solid var(--bor);border-radius:16px;padding:14px;box-shadow:var(--sombra)}
.cha h4{margin:0 0 2px;font-size:13px;font-weight:800}
.cha .sm{font-size:11.5px;color:var(--sub);margin-bottom:12px}
.donut{--a:0;--b:0;position:relative;width:150px;height:150px;border-radius:50%;margin:6px auto 8px;
  background:conic-gradient(var(--c1) 0 var(--p1),var(--c2) var(--p1) var(--p2),var(--c3) var(--p2) 100%);display:flex;align-items:center;justify-content:center}
.donut .hole{width:96px;height:96px;border-radius:50%;background:var(--tar);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .hole b{font-size:26px;font-weight:900;line-height:1}
.donut .hole span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
.dlegend{display:flex;flex-direction:column;gap:6px}
.dlegend div{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.dlegend i{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.dlegend b{margin-left:auto}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b .col{width:100%;max-width:34px;background:var(--pri);border-radius:7px 7px 3px 3px;min-height:3px;transition:height .5s}
.bars .b .col.zero{background:var(--chip)}
.bars .b span{font-size:9.5px;color:var(--sub);font-weight:700}
.bars .b b{font-size:10px;color:var(--pri)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px}
.hbar .track{height:9px;border-radius:6px;background:var(--chip);overflow:hidden}
.hbar .fill{height:100%;border-radius:6px}
/* estadísticas */
.est-filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.est-filtros button{background:var(--tar);border:1px solid var(--bor);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.est-filtros button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.est-filtros .fl{font-size:10.5px;color:var(--sub);font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.est-mini{display:flex;align-items:center;gap:12px}
.bar-mini{width:100%;height:9px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar-mini i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.horas{display:flex;align-items:flex-end;gap:2px;height:104px;margin-top:8px}
.horas .h{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.horas .h i{width:100%;background:var(--pri);border-radius:3px 3px 0 0;min-height:0;display:block}
.horas .h span{font-size:8.5px;color:var(--sub);font-weight:700;height:10px}
/* botón rápido */
.fab{position:fixed;right:15px;bottom:76px;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:26px;font-weight:800;box-shadow:0 6px 20px rgba(30,90,232,.42);z-index:30;display:flex;align-items:center;justify-content:center;line-height:1}
.fab:active{transform:scale(.94)}
@media(min-width:760px){.fab{right:calc((100% - min(960px,100%))/2 + 20px)}}
/* colores configurables */
/* pestañas de Ajustes */
.aj-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.aj-tabs::-webkit-scrollbar{display:none}
.aj-tabs button{flex:0 0 auto;background:var(--chip);border:1px solid var(--bor);color:var(--sub);border-radius:999px;padding:7px 13px;font-family:inherit;font-size:12px;font-weight:800;line-height:1;white-space:nowrap;transition:background .15s ease,color .15s ease}
.aj-tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}

.colo-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bor)}
.colo-row:last-child{border-bottom:none}
.colo-row .nm{flex:1;font-weight:700;font-size:14px}
.colo-row input[type=color]{width:46px;height:34px;border:1px solid var(--bor);border-radius:9px;background:none;padding:2px;cursor:pointer}
/* calendario mejorado */
.cel .cnt{position:absolute;top:3px;right:4px;font-size:9px;font-weight:900;color:var(--sub);background:var(--chip);border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.cel.sel .cnt{background:rgba(255,255,255,.28);color:#fff}
.cel.hoy .cnt{color:var(--pri)}
.cal-hoy{background:var(--pri);color:#fff;border:none;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:800}
.detdia{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.detdia .dd{font-weight:900;font-size:16px}
.detdia .sp{font-size:12px;color:var(--sub)}
/* logout icon */
.ico-svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* línea de tiempo / paisaje cubano */
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tl-dia-lbl{font-size:14px;font-weight:800;color:var(--txt)}
.tl-filtros{display:flex;gap:6px;margin-left:auto}
.tl-filtros button{background:var(--chip);border:none;color:var(--txt);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800}
.tl-filtros button.on{background:var(--pri);color:#fff}
.tl{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--sombra);border:1px solid var(--bor);user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:ew-resize;background:#0b3b46}
.tl .paisaje{display:block;width:100%;height:118px;position:relative;z-index:1}
.tl .cielo{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#B07CC6 0%,#F59E0B 46%,#5EB3BF 100%)}
.tl .rango,.tl .play,.tl .eti,.tl .ticks{z-index:4}
.tl .sol,.tl .luna,.tl .estrellas,.tl .luces{transition:opacity 1.2s linear}
.tl .rango{position:absolute;top:0;bottom:0;background:rgba(30,90,232,.16);border-left:2px solid rgba(255,255,255,.75);border-right:2px solid rgba(255,255,255,.75);pointer-events:none;box-shadow:inset 0 0 22px rgba(0,0,0,.15)}
/* histograma de tareas (estilo ¿Hay Luz?: barras por tramo de 15 min) */
.tl .tl-histbg{position:absolute;left:0;right:0;bottom:22px;height:38px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.42))}
.tl .tl-hist{position:absolute;left:0;right:0;bottom:22px;height:38px;width:100%;z-index:2;pointer-events:none;overflow:visible}
.tl .tl-hist rect{shape-rendering:crispEdges}
.tl .tl-focus{position:absolute;bottom:22px;width:2px;height:38px;background:rgba(255,255,255,.9);z-index:3;pointer-events:none;box-shadow:0 0 8px rgba(0,0,0,.6)}
.tl .tl-focus:before{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(255,255,255,.9)}
.tl .tl-now{position:absolute;top:0;bottom:22px;width:2px;background:rgba(255,224,130,.9);z-index:2;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.5)}
.tl .tl-now:after{content:"ahora";position:absolute;top:2px;left:5px;font-size:9px;font-weight:900;color:#FFE082;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
.tl .play{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6);pointer-events:none;transform:translateX(-50%);border-radius:2px}
.tl .play:after{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.tl .play:before{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:#fff}
.tl .eti{position:absolute;bottom:26px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:5px 13px;border-radius:999px;display:flex;flex-direction:column;align-items:center;line-height:1.15;pointer-events:none;backdrop-filter:blur(4px);white-space:nowrap}
.tl .eti b{font-size:13.5px;font-weight:900}
.tl .eti span{font-size:10px;opacity:.85;text-transform:capitalize}
.tl .ticks{position:absolute;left:0;right:0;bottom:0;height:22px;pointer-events:none}
.tl .tk{position:absolute;bottom:5px;transform:translateX(-50%);font-size:9.5px;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tl .mk{position:absolute;bottom:4px;transform:translateX(-50%);font-size:10px;color:#FFE082;font-weight:900;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tl-out{margin-top:12px}
.tl-dia{padding:5px 0;border-bottom:1px solid var(--bor)}
.tl-dia:last-child{border-bottom:none}
.tl-dh{font-size:12px;font-weight:800;text-transform:capitalize;color:var(--sub);display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border-radius:8px}
.tl-dh span{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px}
.tl-dia.foco{background:var(--pri-soft);border-radius:12px;border-bottom:none;margin:3px 0}
.tl-dia.foco .tl-dh{color:var(--pri)}
.tl-dia.foco .tl-dh span{background:var(--pri);color:#fff}
.tl-nota{font-size:12.5px;color:var(--sub);margin:8px 2px 0;display:flex;align-items:flex-start;gap:6px}
.tl-nota b{color:inherit}
.tl-rangoctl{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.tl-rangoctl .tl-sub{font-size:12px;color:var(--sub);font-weight:700;margin-left:2px}
.tl-rangoctl button{width:36px;height:36px;border-radius:10px;border:none;background:var(--chip);color:var(--txt);font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tl-rangoctl #tl-hoy{width:auto;padding:0 14px;background:var(--pri);color:#fff;font-size:13px}
.tl-sw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt);font-weight:700;background:var(--chip);border-radius:999px;padding:7px 12px}
.tl-sw input{width:auto;margin:0}
.tl-hora{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--sub);font-weight:700;flex-wrap:wrap}
.tl-hora b{color:var(--txt);font-size:13px}
.tl-hora input[type=range]{flex:1;min-width:120px;accent-color:var(--pri);margin:0}
.tl-hora button{border:none;background:var(--chip);color:var(--txt);border-radius:9px;padding:6px 10px;font-weight:700;font-size:12px}
/* rango de búsqueda de la línea de tiempo */
.tl-rangeblk{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
.tl-rangeblk .tl-sub{font-size:12px;color:var(--sub);font-weight:700}
.tl-rangeblk>button{background:var(--chip);border:none;color:var(--txt);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800}
.tl-rangeblk>button.on{background:var(--pri);color:#fff}
.tl-rangeblk.tl-rcustom input{width:auto;flex:1;min-width:104px;padding:8px 10px;font-size:13.5px}
.tl-rangeblk.tl-rcustom button{background:var(--pri);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800}
.tl-rango-lbl{background:var(--pri-soft);color:var(--pri);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center}
.tl-dh2{font-size:11.5px;font-weight:800;color:var(--pri);padding:0 6px 6px}
.tl-dh3{font-size:11px;color:var(--sub);font-weight:600;padding:6px 6px 2px}

/* ============================================================
   REDISEÑO PREMIUM 2026 · dashboard, cabecera, tarjetas y nav
   ============================================================ */
:root{
  --bg:#F4F7FC; --bg2:#EDF3FA; --tar:#FFFFFF; --chip:#EEF2F9; --inp:#FFFFFF;
  --txt:#0C1424; --sub:#5A6879; --pri:#1E5AE8; --pri2:#1243B0; --pri-soft:#E7EEFF; --pri-txt:#FFFFFF;
  --bor:#E4EAF3; --ok:#0B7A43; --ok-soft:#E2F7EC; --warn:#8A5200; --warn-soft:#FFF2DC;
  --peli:#B3261E; --peli-soft:#FDE8E8; --ind:#5E2CA5; --ind-soft:#F1E9FD;
  --nav:#FFFFFF;
  --sombra:0 1px 2px rgba(15,35,70,.04),0 16px 30px -24px rgba(15,35,70,.55);
  --sombra2:0 24px 48px -24px rgba(15,35,70,.6);
  --btn1:#2F6FE0; --btn2:#1243B0; --btn-shadow:rgba(30,90,232,.75);
  --hero-a:#1E3A8A; --hero-b:#1D4ED8; --hero-c:#1E40AF;
  --hero-glow1:rgba(125,186,255,.9); --hero-glow2:rgba(129,140,248,.75); --hero-shadow:rgba(29,78,216,.95);
  --yo1:#7CB6FF; --yo2:#2563EB; --yo3:#123C9E;
  --tar-glass:rgba(255,255,255,.64);
}
html[data-tema=oscuro]{
  --bg:#070A10; --bg2:#0B1018; --tar:#121824; --chip:#1A2231; --inp:#0E141E;
  --txt:#E8EEF8; --sub:#8C99AE; --pri:#4C8DFF; --pri2:#2F6FE0; --pri-soft:#16233C; --pri-txt:#FFFFFF;
  --bor:#222B3A; --ok:#3DDC84; --ok-soft:#102A1D; --warn:#E0A33A; --warn-soft:#2E2310;
  --peli:#F0574A; --peli-soft:#2E1512; --ind:#B08CF5; --ind-soft:#201A33;
  --nav:#0E141E;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 18px 30px -24px rgba(0,0,0,.85);
  --sombra2:0 24px 48px -24px rgba(0,0,0,.9);
  --btn1:#2563EB; --btn2:#1243B0; --btn-shadow:rgba(0,0,0,.55);
  --tar-glass:rgba(18,24,36,.62);
}
body{
  background:
    #F8FAFD;
  background-attachment:fixed;
}
html[data-tema=oscuro] body{
  background:
    #0A0F18;
  background-attachment:fixed;
}

/* cabecera clara tipo cristal */
.cab .marca img{width:30px;height:30px;border-radius:9px;border:0;box-shadow:0 4px 12px -6px rgba(30,90,232,.6)}
.cab .marca b{color:var(--txt);font-size:16px;font-weight:900;letter-spacing:-.02em}
.icon-btn{background:var(--chip);color:var(--txt);border:1px solid var(--bor);width:38px;height:38px;border-radius:50%;font-size:16px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.icon-btn:active{background:var(--pri-soft);color:var(--pri);transform:scale(.95)}
.icon-btn .dot-n{border-color:var(--nav);background:#E5484D;top:-2px;right:-2px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cab .yo{width:38px;height:38px;border-radius:50%;border:0;background:radial-gradient(circle at 32% 18%,var(--yo1) 0%,var(--yo2) 48%,var(--yo3) 100%);box-shadow:0 8px 16px -8px var(--hero-shadow)}
.ico-svg{stroke:currentColor}
.k-ico .ico-svg{width:17px;height:17px}
nav.tab .ico .ico-svg{width:22px;height:22px}
.mr-ico .ico-svg{width:19px;height:19px}

main{padding:14px;padding-bottom:104px}
.tar{border-radius:20px;border:1px solid var(--bor);box-shadow:var(--sombra);padding:14px}
h2.sec{font-size:10.5px;letter-spacing:.12em;color:var(--sub);margin:16px 2px 8px}
h2.sec .link{border:0;background:none;padding:0;font-family:inherit;font-size:12px;font-weight:800;color:var(--pri);text-transform:none;letter-spacing:0;cursor:pointer}
h2.sec .link:active{opacity:.7}

/* botones e inputs */
/* (v1.9.0: el segundo .btn solapado se fusiono arriba) */
/* (v1.9.0: el segundo .btn.sec solapado se fusiono arriba) */
.btn:active{transform:translateY(1px) scale(.995)}
input,select,textarea{border-radius:13px;border-color:var(--bor);background:var(--inp)}

/* hero */
/* saludo plano (sin caja azul) - el color queda para acentos */
.progreso{gap:16px}

/* tarjetas de resumen premium */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stats .k{
  background:var(--tar);
  border:1px solid rgba(15,35,70,.055);border-radius:19px;padding:11px 12px;
  box-shadow:0 1px 2px rgba(15,35,70,.06);
  cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;
}
/* v1.9.0: tablero con arrastre real (pulsar largo, arrastrar, soltar en columna) */
.kb-card.lift{transform:scale(1.05);box-shadow:0 12px 26px rgba(15,35,70,.30);opacity:.94;position:relative;z-index:5}
.kb-body.drop-on{outline:2px dashed var(--pri);outline-offset:-3px;border-radius:14px;background:var(--pri-soft)}
/* (v1.9.0: el segundo .stats .k solapado se fusiono arriba) */
html[data-tema=oscuro] .stats .k{border-color:var(--bor)}
.stats .k:active{transform:scale(.985)}
.stats .k .k-ico{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;font-size:14px;margin:0 0 7px;background:var(--pri-soft)}
.stats .k b{font-size:24px;font-weight:900;line-height:1;letter-spacing:-.03em;display:block}
.stats .k .k-lbl{display:block;font-size:11px;color:var(--sub);font-weight:650;margin-top:4px}
.stats .k.cpri .k-ico{background:var(--pri-soft)}
.stats .k.manana .k-ico{background:var(--ind-soft)}
.stats .k.cwarn .k-ico{background:var(--warn-soft)}
.stats .k.cind .k-ico{background:var(--ind-soft)}
.stats .k.crojo .k-ico{background:var(--peli-soft)}
.stats .k.cok .k-ico{background:var(--ok-soft)}
.stats .k .k-del{
  position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
  border:2px solid var(--tar);background:#E5484D;color:#fff;font-family:inherit;font-size:12px;font-weight:900;
  line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
  opacity:0;transform:scale(.55);transition:opacity .15s,transform .15s;box-shadow:0 5px 12px -4px rgba(217,45,45,.8);z-index:3;
}
.stats.edit .k .k-del{opacity:1;transform:scale(1)}
/* modo edición: borde punteado sutil, sin tembleque */
.stats.edit .k{outline:1px dashed var(--pri-soft)}
.stats.edit .k:active{box-shadow:0 0 0 2px var(--pri-soft)}
.stats .k.wide{
  grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic num" "ic lbl";
  column-gap:12px;align-items:center;padding:12px 14px;
}
.stats .k.wide .k-ico{grid-area:ic;margin:0}
.stats .k.wide b{grid-area:num}
.stats .k.wide .k-lbl{grid-area:lbl;margin:0}
.dash-hint{display:none;align-items:center;gap:5px;font-size:11px;color:var(--sub);font-weight:600;margin:0 2px 12px}
.dash-hint.on{display:flex}
.dash-hint b{color:var(--peli)}
.dash-vacio{
  background:var(--tar);border:1.5px dashed var(--bor);border-radius:19px;
  padding:18px 14px;text-align:center;box-shadow:var(--sombra);margin-bottom:14px;
}
.dash-vacio .dv-ic{font-size:22px;line-height:1}
.dash-vacio b{display:block;font-size:13px;margin-top:6px}
.dash-vacio span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.dash-vacio .btn{margin-top:11px;padding:9px 13px;font-size:12px;width:auto;display:inline-block}

/* próxima tarea del día */
.next{display:flex;align-items:center;gap:10px;background:var(--tar);border:1px solid var(--bor);border-radius:18px;padding:10px 11px;box-shadow:var(--sombra);cursor:pointer}
.next .hora{width:52px;flex:0 0 auto;text-align:center;border-radius:12px;background:var(--pri-soft);padding:6px 0}
.next .hora b{display:block;font-size:12.5px;font-weight:800;color:var(--pri);line-height:1.15}
.next .hora span{display:block;font-size:8.5px;font-weight:800;color:var(--pri);opacity:.75;text-transform:uppercase;letter-spacing:.03em}
.next .txt{flex:1;min-width:0}
.next .txt b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .txt span{display:block;font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .who{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:0 0 auto}
.next .arrow{color:var(--sub);font-size:16px;margin-left:-2px}
.next:active{transform:scale(.99)}

.alerta{border-radius:16px}
.fila-lista{border-radius:18px;border-color:var(--bor);box-shadow:var(--sombra)}
.tl{border-radius:20px;box-shadow:var(--sombra)}
.cha{border-radius:18px;box-shadow:var(--sombra)}
.overlay .sheet{border-radius:24px 24px 0 0}
.modal .box{border-radius:24px 24px 0 0}

/* nav flotante de 5 accesos */
nav.tab{
  left:50%;right:auto;transform:translateX(-50%);
  width:calc(100% - 20px);max-width:520px;
  bottom:calc(8px + env(safe-area-inset-bottom));
  height:64px;border-radius:22px;padding:0 4px;
  background:var(--nav);border:1px solid var(--bor);
  box-shadow:0 18px 34px -18px rgba(15,23,42,.5);
  overflow:hidden;
}
nav.tab button{font-size:12px;padding:6px 0 5px;gap:2px;border-radius:18px;min-height:48px}
nav.tab .ico{font-size:24px;width:44px;height:28px;display:grid;place-items:center;border-radius:10px;line-height:1}
nav.tab button.on{color:var(--pri)}
nav.tab button.on .ico{background:var(--pri-soft)}
nav.tab button:active{background:var(--chip)}

/* FAB */
.fab{
  bottom:calc(84px + env(safe-area-inset-bottom));right:18px;width:54px;height:54px;border-radius:18px;
  background:radial-gradient(circle at 32% 18%,#7CB6FF 0%,#2563EB 48%,#123C9E 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 18px 30px -12px rgba(29,78,216,.85);
}
@media(min-width:760px){.fab{right:calc((100% - min(960px,100%))/2 + 20px)}}

/* pantalla Más */
.mas-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bor);padding:12px 2px;font-family:inherit;color:var(--txt);cursor:pointer}
.mas-row:last-child{border-bottom:0}
.mas-row .mr-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:var(--pri-soft)}
.mas-row .mr-t{flex:1;min-width:0}
.mas-row .mr-t b{display:block;font-size:14.5px;font-weight:800}
.mas-row .mr-t span{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.mas-row .mr-a{color:var(--sub);font-size:18px}
.mas-row:active{opacity:.75}

/* ===== tarjetas del resumen: salida animada y arrastre para reordenar ===== */
.stats .k.saliendo{opacity:0;transform:scale(.84) !important;animation:none !important;transition:opacity .16s ease,transform .16s ease}
.stats.edit .k{touch-action:none;cursor:grab}
.stats .k.dragging{opacity:.95;animation:none !important;z-index:6;cursor:grabbing;box-shadow:0 20px 34px -16px rgba(15,23,42,.55)}
.stats.reordenando .k:not(.dragging){transition:transform .14s ease}

/* ===== línea de tiempo: cabecera compacta ===== */
.tl-top{display:flex;align-items:center;gap:8px;margin:14px 2px 8px}
.tl-daynav{display:flex;align-items:center;gap:3px;background:var(--chip);border:1px solid var(--bor);border-radius:999px;padding:3px}
.tl-daynav button{border:0;background:none;color:var(--txt);font-family:inherit;font-size:15px;font-weight:800;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;line-height:1;padding:0}
.tl-daynav button:active{background:var(--tar)}
.tl-daynav #tl-hoy{width:auto;padding:0 10px;font-size:11.5px;background:var(--pri);color:#fff;box-shadow:0 6px 12px -7px rgba(30,90,232,.9)}
.tl-daynav #tl-pick{background:var(--tar);border:1px solid var(--bor);font-size:13px}
.tl-filtros{margin-left:auto;display:flex;gap:2px;background:var(--chip);border:1px solid var(--bor);border-radius:999px;padding:3px}
.tl-filtros button{border:0;background:none;color:var(--sub);border-radius:999px;padding:5px 9px;font-family:inherit;font-size:10.5px;font-weight:800;line-height:1.1}
.tl-filtros button.on{background:var(--tar);color:var(--pri);box-shadow:0 4px 10px -7px rgba(15,23,42,.6)}

/* ===== línea de tiempo: tarjeta ===== */
.tl{box-shadow:0 1px 2px rgba(15,35,70,.05),0 22px 38px -26px rgba(15,23,42,.6)}
.tl .paisaje{height:122px}
.tl .grid{position:absolute;inset:0 0 22px;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.11) 0 1px,rgba(255,255,255,0) 1px 12.5%)}
.tl .tl-histbg{bottom:22px;height:44px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5))}
.tl .tl-hist{bottom:22px;height:44px}
.tl .tl-hist rect{rx:.35}
.tl .tl-focus{bottom:22px;height:44px}
.tl .eti{bottom:28px;background:rgba(8,14,26,.66);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:4px 11px 5px;box-shadow:0 8px 18px -10px rgba(0,0,0,.9)}
.tl .eti b{font-size:12px;letter-spacing:-.01em}
.tl .eti span{font-size:9.5px;opacity:.8}
.tl .play{width:2px}
.tl .play:after{width:13px;height:13px}
.tl .tk{font-size:9px;letter-spacing:.02em}

/* ===== línea de tiempo: controles y lista ===== */
.tl-buscar{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap}
.tl-buscar .tl-sub{font-size:10px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.09em;margin-right:1px}
.tl-buscar>button{border:1px solid var(--bor);background:var(--tar);color:var(--txt);border-radius:999px;padding:6px 10px;font-family:inherit;font-size:11.5px;font-weight:800;line-height:1.1}
.tl-buscar>button.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 8px 16px -11px rgba(30,90,232,.95)}
.tl-buscar .tl-rango-lbl{margin-left:auto}
.tl-nota{font-size:11px;margin:8px 2px 0}
.tl-dh{font-size:12px}
.tl-dh2{display:none}
.tl-out{margin-top:10px}
.tl-out .tl-dia.foco{padding:6px 8px 4px}

/* ===== resumen: mover cada tarjeta y borrar de una en una ===== */
.stats.edit .k{padding-bottom:38px}
.k-mv{display:none;position:absolute;left:8px;bottom:8px;gap:5px;z-index:3}
.stats.edit .k-mv{display:flex}
.k-mv button{
  width:27px;height:24px;border-radius:8px;border:1px solid var(--bor);
  background:var(--tar);color:var(--txt);font-family:inherit;font-size:15px;font-weight:900;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:0 3px 8px -4px rgba(15,23,42,.45);
}
.k-mv button:active{background:var(--pri-soft);color:var(--pri);transform:scale(.94)}
.stats.edit .k.wide{padding-bottom:14px}
.stats.edit .k.wide .k-mv{left:auto;right:38px;bottom:10px}
.dash-hint{justify-content:space-between}
.dash-hint .dh-t{display:flex;align-items:center;gap:5px;min-width:0}
.dash-add{
  margin-left:auto;border:1px solid var(--pri);background:var(--pri-soft);color:var(--pri);
  font-family:inherit;font-size:11px;font-weight:800;border-radius:999px;padding:6px 11px;line-height:1;
  flex:0 0 auto;
}
.dash-add:active{transform:scale(.96)}

/* ===== línea de tiempo: marcas de tareas, leyenda y añadir ===== */
.tl .tl-mks{position:absolute;left:10px;right:10px;bottom:22px;height:64px;z-index:6;pointer-events:none}
.tl .tl-mk{
  position:absolute;bottom:2px;transform:translateX(-50%);width:20px;height:64px;padding:0;border:0;background:none;
  pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;
}
.tl .tl-mk i{
  width:8px;height:8px;border-radius:50%;display:block;
  box-shadow:0 0 0 2px rgba(255,255,255,.92),0 2px 6px rgba(0,0,0,.55);
  transition:transform .12s ease,opacity .2s ease;
}
.tl .tl-mk:active i{transform:scale(1.4)}
.tl .tl-mk.hecha i{opacity:.42}
.tl .tl-mk.fuera i{opacity:.22}
.tl .tl-mk.rec i{border-radius:2px;transform:rotate(45deg);background:var(--warn)}
.tl .tl-mk.rec:active i{transform:rotate(45deg) scale(1.35)}
.tl .tl-mk.rec.fuera i{opacity:.28}
.tl-nota{justify-content:space-between;align-items:center;gap:8px}
.tl-nota .tl-nota-txt{display:flex;align-items:flex-start;gap:6px;flex:1;min-width:0}
.tl-addbtn{
  border:1px solid var(--pri);background:var(--pri);color:#fff;font-family:inherit;font-size:11.5px;font-weight:800;
  border-radius:999px;padding:7px 12px;line-height:1;flex:0 0 auto;
  box-shadow:0 8px 16px -10px rgba(30,90,232,.95);
}
.tl-addbtn:active{transform:scale(.96)}
.tl-leyenda{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--sub);font-weight:800;margin:9px 2px 0}
.tl-leyenda span{display:inline-flex;align-items:center;gap:4px}
.tl-leyenda i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tl-leyenda .tl-cuenta{margin-left:auto;color:var(--pri)}
.tl-vacio{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tl-vacio-btn{border:1px solid var(--pri);background:var(--pri-soft);color:var(--pri);font-family:inherit;font-size:11.5px;font-weight:800;border-radius:999px;padding:7px 12px;line-height:1}

/* ============================================================
   MOTOR DE TEMAS · paletas, acabado, densidad y accesibilidad
   ============================================================ */
/* --- paletas claras --- */
html[data-paleta=bosque]{--pri:#1F7A54;--pri2:#145C3E;--pri-soft:#DDF3E8;--btn1:#1F7A54;--btn2:#145C3E;--btn-shadow:rgba(20,92,62,.5);--hero-a:#0B3B32;--hero-b:#1F7A54;--hero-c:#145C3E;--hero-glow1:rgba(110,231,183,.75);--hero-glow2:rgba(52,211,153,.5);--hero-shadow:rgba(16,94,64,.85);--yo1:#6EE7B7;--yo2:#1F7A54;--yo3:#0B3B32}
html[data-paleta=atardecer]{--pri:#C2410C;--pri2:#9A3412;--pri-soft:#FFEDD5;--btn1:#C2410C;--btn2:#9A3412;--btn-shadow:rgba(154,52,18,.5);--hero-a:#7C2D12;--hero-b:#C2410C;--hero-c:#9A3412;--hero-glow1:rgba(253,186,116,.8);--hero-glow2:rgba(251,146,60,.55);--hero-shadow:rgba(154,52,18,.9);--yo1:#FDBA74;--yo2:#C2410C;--yo3:#7C2D12}
html[data-paleta=lavanda]{--pri:#6D28D9;--pri2:#5B21B6;--pri-soft:#EDE9FE;--btn1:#6D28D9;--btn2:#5B21B6;--btn-shadow:rgba(91,33,182,.55);--hero-a:#4C1D95;--hero-b:#7C3AED;--hero-c:#5B21B6;--hero-glow1:rgba(196,181,253,.8);--hero-glow2:rgba(167,139,250,.55);--hero-shadow:rgba(91,33,182,.9);--yo1:#C4B5FD;--yo2:#7C3AED;--yo3:#4C1D95}
html[data-paleta=arena]{--pri:#A16207;--pri2:#854D0E;--pri-soft:#FEF3C7;--btn1:#A16207;--btn2:#854D0E;--btn-shadow:rgba(133,77,14,.5);--hero-a:#713F12;--hero-b:#A16207;--hero-c:#854D0E;--hero-glow1:rgba(253,224,71,.7);--hero-glow2:rgba(250,204,21,.5);--hero-shadow:rgba(133,77,14,.9);--yo1:#FDE68A;--yo2:#A16207;--yo3:#713F12}
html[data-paleta=grafito]{--pri:#334155;--pri2:#1E293B;--pri-soft:#E2E8F0;--btn1:#334155;--btn2:#1E293B;--btn-shadow:rgba(15,23,42,.5);--hero-a:#0F172A;--hero-b:#334155;--hero-c:#1E293B;--hero-glow1:rgba(148,163,184,.6);--hero-glow2:rgba(100,116,139,.5);--hero-shadow:rgba(15,23,42,.95);--yo1:#94A3B8;--yo2:#475569;--yo3:#1E293B}
html[data-paleta=monocromo]{--pri:#111827;--pri2:#000000;--pri-soft:#E5E7EB;--btn1:#111827;--btn2:#000000;--btn-shadow:rgba(0,0,0,.55);--hero-a:#000000;--hero-b:#1F2937;--hero-c:#111827;--hero-glow1:rgba(255,255,255,.35);--hero-glow2:rgba(255,255,255,.2);--hero-shadow:rgba(0,0,0,.95);--yo1:#9CA3AF;--yo2:#374151;--yo3:#111827}
html[data-paleta=contraste]{--pri:#0000CC;--pri2:#000066;--pri-soft:#E6E6FF;--btn1:#0000CC;--btn2:#000066;--btn-shadow:rgba(0,0,102,.6);--hero-a:#000033;--hero-b:#0000CC;--hero-c:#000066;--hero-glow1:rgba(255,255,255,.35);--hero-glow2:rgba(255,255,255,.2);--hero-shadow:rgba(0,0,102,.95);--yo1:#FFFFFF;--yo2:#0000CC;--yo3:#000033;--sub:#333333;--bor:#9CA3AF}
/* --- paletas oscuras --- */
html[data-tema=oscuro][data-paleta=bosque]{--pri:#34D399;--pri2:#10B981;--pri-soft:#10281F;--btn1:#1B7A50;--btn2:#145C3E;--hero-a:#0B3B32;--hero-b:#1F7A54;--hero-c:#145C3E;--hero-glow1:rgba(110,231,183,.55);--hero-glow2:rgba(52,211,153,.35);--hero-shadow:rgba(0,0,0,.85);--yo1:#6EE7B7;--yo2:#1F7A54;--yo3:#0B3B32}
html[data-tema=oscuro][data-paleta=atardecer]{--pri:#FB923C;--pri2:#F97316;--pri-soft:#2E1A0E;--btn1:#C2410C;--btn2:#9A3412;--hero-a:#7C2D12;--hero-b:#C2410C;--hero-c:#9A3412;--hero-glow1:rgba(253,186,116,.5);--hero-glow2:rgba(251,146,60,.3);--hero-shadow:rgba(0,0,0,.85);--yo1:#FDBA74;--yo2:#C2410C;--yo3:#7C2D12}
html[data-tema=oscuro][data-paleta=lavanda]{--pri:#A78BFA;--pri2:#8B5CF6;--pri-soft:#1E1B33;--btn1:#6D28D9;--btn2:#5B21B6;--hero-a:#4C1D95;--hero-b:#7C3AED;--hero-c:#5B21B6;--hero-glow1:rgba(196,181,253,.5);--hero-glow2:rgba(167,139,250,.3);--hero-shadow:rgba(0,0,0,.85);--yo1:#C4B5FD;--yo2:#7C3AED;--yo3:#4C1D95}
html[data-tema=oscuro][data-paleta=arena]{--pri:#FACC15;--pri2:#EAB308;--pri-soft:#2A2410;--btn1:#A16207;--btn2:#854D0E;--hero-a:#713F12;--hero-b:#A16207;--hero-c:#854D0E;--hero-glow1:rgba(253,224,71,.45);--hero-glow2:rgba(250,204,21,.3);--hero-shadow:rgba(0,0,0,.85);--yo1:#FDE68A;--yo2:#A16207;--yo3:#713F12}
html[data-tema=oscuro][data-paleta=grafito]{--pri:#94A3B8;--pri2:#64748B;--pri-soft:#1E2430;--btn1:#334155;--btn2:#1E293B;--hero-a:#0F172A;--hero-b:#334155;--hero-c:#1E293B;--hero-glow1:rgba(148,163,184,.4);--hero-glow2:rgba(100,116,139,.3);--hero-shadow:rgba(0,0,0,.9);--yo1:#94A3B8;--yo2:#475569;--yo3:#1E293B}
html[data-tema=oscuro][data-paleta=monocromo]{--pri:#E5E7EB;--pri2:#9CA3AF;--pri-soft:#1F2937;--btn1:#111827;--btn2:#000000;--hero-a:#000000;--hero-b:#1F2937;--hero-c:#111827;--hero-glow1:rgba(255,255,255,.28);--hero-glow2:rgba(255,255,255,.16);--hero-shadow:rgba(0,0,0,.95);--yo1:#9CA3AF;--yo2:#374151;--yo3:#111827}
html[data-tema=oscuro][data-paleta=contraste]{--pri:#FFFF00;--pri2:#FFD400;--pri-soft:#1A1A00;--btn1:#0000CC;--btn2:#000066;--hero-a:#000000;--hero-b:#0000CC;--hero-c:#000066;--hero-glow1:rgba(255,255,0,.25);--hero-glow2:rgba(255,255,255,.15);--hero-shadow:rgba(0,0,0,.95);--yo1:#FFFFFF;--yo2:#0000CC;--yo3:#000000;--sub:#E5E7EB;--bor:#FFFFFF}

/* --- AMOLED: negro puro --- */
html[data-tema=oscuro][data-amoled=on]{--bg:#000;--bg2:#000;--tar:#05070B;--nav:#000;--inp:#080B10;--chip:#10141B;--bor:#1C2330;--tar-glass:rgba(5,7,11,.72)}
html[data-tema=oscuro][data-amoled=on] body{background:#000}

/* --- tarjetas translúcidas (opt-in: cuesta rendimiento) --- */
html[data-cristal=on] .tar,html[data-cristal=on] .stats .k{
  background:var(--tar-glass)!important;
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  border-color:rgba(255,255,255,.38);
}
html[data-tema=oscuro][data-cristal=on] .tar,html[data-tema=oscuro][data-cristal=on] .stats .k{border-color:rgba(255,255,255,.09)}

/* --- densidad --- */
html[data-densidad=compacta] main{padding:10px;padding-bottom:96px}
html[data-densidad=compacta] .tar{padding:11px;border-radius:16px}
html[data-densidad=compacta] .stats{gap:7px;margin-bottom:11px}
html[data-densidad=compacta] .stats .k{padding:9px 10px}
html[data-densidad=compacta] .tarea{padding:7px 8px}
html[data-densidad=compacta] .form-sec{margin-top:10px;padding-top:9px}
html[data-densidad=compacta] .btn{padding:10px}
html[data-densidad=compacta] h2.sec{margin:12px 2px 6px}

/* --- radio --- */
html[data-radio=suave] .tar,html[data-radio=suave] .stats .k,html[data-radio=suave] .btn,html[data-radio=suave] input,html[data-radio=suave] select,html[data-radio=suave] textarea,html[data-radio=suave] .cel,html[data-radio=suave] .cal-mes,html[data-radio=suave] .hola,html[data-radio=suave] .dash-vacio,html[data-radio=suave] .next,html[data-radio=suave] .fila-lista,html[data-radio=suave] .mas-row{border-radius:14px}
