html[data-radio=recto] .tar,html[data-radio=recto] .stats .k,html[data-radio=recto] .btn,html[data-radio=recto] input,html[data-radio=recto] select,html[data-radio=recto] textarea,html[data-radio=recto] .cel,html[data-radio=recto] .cal-mes,html[data-radio=recto] .hola,html[data-radio=recto] .dash-vacio,html[data-radio=recto] .next,html[data-radio=recto] .fila-lista,html[data-radio=recto] .mas-row{border-radius:8px}

/* --- texto grande --- */
html[data-texto=grande] .tarea .tt{font-size:16.5px}
html[data-texto=grande] .meta{font-size:13px}
html[data-texto=grande] .lbl,html[data-texto=grande] .hint{font-size:13px}
html[data-texto=grande] h2.sec{font-size:11.5px}
html[data-texto=grande] .btn{font-size:16px}
html[data-texto=grande] .stats .k .k-lbl{font-size:12.5px}
html[data-texto=grande] .stats .k b{font-size:26px}
html[data-texto=grande] .form-sec .fs-h b{font-size:14.5px}
html[data-texto=grande] nav.tab button{font-size:13px}

/* --- foco visible para teclado y accesibilidad --- */
:where(button,a,input,select,textarea,[role=button]):focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
:where(.swipe,.tar,.stats) :focus-visible{outline-offset:-2px}

/* --- movimiento reducido (sistema o ajuste manual) --- */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
html[data-motion=reducido] *,html[data-motion=reducido] *:before,html[data-motion=reducido] *:after{
  animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important
}

/* --- Ajustes › Apariencia --- */
.ap-bloque{margin-top:15px}
.ap-bloque:first-child{margin-top:0}
.ap-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);font-weight:800;margin:0 0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;background:var(--chip);border:1px solid var(--bor);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--sub);border-radius:9px;padding:8px 3px;font-size:11.5px;font-weight:800;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button.on{background:var(--tar);color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pal{border:1.5px solid var(--bor);background:var(--tar);border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:4px;align-items:stretch;font-family:inherit;color:var(--txt);min-width:0}
.pal i{display:block;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--pc1),var(--pc2))}
.pal span{display:block;font-size:10px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.acento-row{display:flex;align-items:center;gap:9px}
.acento-row input[type=color]{width:54px;height:38px;padding:3px;border-radius:10px;flex:0 0 auto}
.ap-hint{font-size:11.5px;color:var(--sub);margin:7px 0 0;line-height:1.4}

/* --- rellenos con texto blanco: usan el tono seguro (AA) --- */
.filtros button.on,.tl-filtros button.on,.tl-buscar>button.on,.cal-hoy,.tl-addbtn,.fila-lista .fl-n,.b-ap,.sem-d .n,.tl-rangoctl #tl-hoy,.tl-rangeblk>button.on,.tl-daynav #tl-hoy,.tl-dia.foco .tl-dh span,.tl-rangeblk.tl-rcustom button,.modal .btns .msi.pri,.form-head .fh-b{background:var(--btn1);border-color:var(--btn1)}
.cel.sel,.sem-d.sel,.fab,.cal-mes-row .badge-mes{background:var(--btn1);border-color:var(--btn1)}
.calhead button:active,.cal-nav button:active,.cg-add:active{background:var(--btn1);border-color:var(--btn1)}

/* ============================================================
   DASHBOARD JEFE · tira de días, agenda compacta y carga del equipo
   ============================================================ */
/* tira de 7 días para saltar de jornada sin entrar en Agenda */
.tira-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px}
.tira-head .th-t{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--sub)}
.tira-nav{display:flex;gap:4px}
.tira-nav button{width:28px;height:28px;border-radius:9px;border:1px solid var(--bor);background:var(--chip);color:var(--txt);font-family:inherit;font-size:14px;font-weight:900;line-height:1;display:grid;place-items:center}
.tira-nav button:active{background:var(--pri-soft);color:var(--pri)}
.tira{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;overscroll-behavior-x:contain}
.tira::-webkit-scrollbar{display:none}
.tira .td{
  flex:0 0 auto;width:48px;border:1px solid var(--bor);background:var(--tar);color:var(--txt);
  border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:inherit;box-shadow:var(--sombra);
}
.tira .td .d{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.tira .td .n{font-size:16px;font-weight:900;line-height:1.1}
.tira .td .p{font-size:9.5px;font-weight:800;color:var(--sub);min-height:13px;line-height:1.2}
.tira .td .p b{color:var(--pri)}
.tira .td.hoy{border-color:var(--btn1);background:var(--btn1);color:#fff;box-shadow:0 10px 18px -12px var(--btn-shadow)}
.tira .td.hoy .d,.tira .td.hoy .p,.tira .td.hoy .p b{color:rgba(255,255,255,.92)}
.tira .td:active{transform:scale(.96)}

/* chips de foco dentro del saludo */
.hola-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
.hola-chips span{background:var(--tar);border:1px solid var(--bor);border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;color:var(--pri);line-height:1.3}

/* agenda compacta (línea de tiempo reducida a lo que queda del día) */
.mini-ag{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.mini-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;color:var(--txt);
  background:var(--tar);border:1px solid var(--bor);border-radius:14px;padding:9px 11px;box-shadow:var(--sombra);
}
.mini-row .mh{font-size:11.5px;font-weight:900;color:var(--pri);background:var(--pri-soft);border-radius:9px;padding:5px 7px;min-width:48px;text-align:center;flex:0 0 auto}
.mini-row .mt{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .md{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mini-row:active{background:var(--chip)}
.mini-vacio{padding:14px 10px;text-align:center;font-size:12.5px}

/* tarjetas especiales: carga del equipo */
.stats .k.cseg .k-ico{background:var(--ok-soft)}
.stats .k.crev .k-ico{background:var(--warn-soft)}
.stats .k.cequipo .k-ico{background:var(--pri-soft)}
.stats .k.kcustom{grid-column:1/-1;display:block;padding:12px 13px}
.stats .k.kcustom .k-tt{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.stats .k.kcustom .k-tt .k-ico{margin:0;flex:0 0 auto}
.stats .k.kcustom .k-tt b{font-size:14px;font-weight:900;letter-spacing:-.01em}
.stats .k.kcustom .k-lbl{margin:0}
.keq-row{display:flex;align-items:center;gap:8px;margin-top:7px}
.keq-n{width:66px;flex:0 0 auto;font-size:11.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .k .keq-track{display:block;flex:1;min-width:0;height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.stats .k .keq-track i{display:block;height:100%;border-radius:999px;background:var(--btn1)}
.stats .k .keq-row b{width:20px;flex:0 0 auto;text-align:right;font-size:11.5px;font-weight:900}
.keq-more{margin-top:7px;font-size:11px;color:var(--sub);font-weight:650}

/* hoja de carga del equipo */
.eq-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--tar);border:1px solid var(--bor);border-radius:14px;padding:9px 11px;margin-bottom:7px;text-align:left;font-family:inherit;color:var(--txt)}
.eq-row:active{background:var(--chip)}
.eq-row .eq-t{flex:1;min-width:0}
.eq-row .eq-t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-row .eq-t span{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.eq-row .eq-t .keq-track{height:6px;margin-top:5px}
.eq-row .eq-n{font-size:15px;font-weight:900;color:var(--pri);flex:0 0 auto}
/* pasos y etiquetas (v1.3) */
.sub-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.sub-row input[type=text]{flex:1;min-width:0;margin:0}
.sub-x{background:none;border:none;color:var(--sub);font-size:15px;padding:4px;cursor:pointer}
.subs-line{display:flex;align-items:center;gap:8px;margin-top:7px}
.subs-bar{flex:0 0 74px;height:6px;border-radius:3px;background:var(--pri-soft,#cfe0f7);overflow:hidden}
.subs-bar i{display:block;height:100%;background:var(--pri);border-radius:3px}
.subs-bar.compl i{background:var(--ok,#1F8A3C)}
.subs-line span{font-size:11.5px;color:var(--sub);white-space:nowrap}
.tags-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tagc{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px}
/* ======== v1.4.0 ======== */
.snack{position:fixed;left:14px;right:14px;bottom:86px;z-index:80;display:none;align-items:center;justify-content:space-between;gap:12px;background:#20242B;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.snack.on{display:flex;animation:snack-in .18s ease}
@keyframes snack-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.snack button{background:none;border:none;color:#8AB4F8;font-weight:800;font-size:14px;padding:6px 4px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
html[data-tema=oscuro] .snack{background:#2E323B}
.carga-linea{font-size:12.5px;color:var(--sub);font-weight:700;margin:0 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.carga-linea.sobrecarga{color:var(--warn)}
.carga-linea.sobrecarga b{color:var(--peli)}
.alerta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alerta .alerta-b,.alerta-b{width:auto;display:inline-block;margin:0;padding:6px 12px;font-size:12.5px;flex-shrink:0;background:var(--chip);color:var(--txt);border:1px solid var(--bor);border-radius:10px;font-weight:800;cursor:pointer}
.ef-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bor);cursor:pointer}
.ef-row:last-of-type{border-bottom:none}
.ef-n{width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ef-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ef-b b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ef-b b.ef-v{color:var(--peli)}
.ef-b span{font-size:11.5px;color:var(--sub)}
.ef-alta{color:var(--warn);flex-shrink:0}
.ef-card .btn{margin-top:8px}
.cd-choca{color:var(--warn);font-weight:700}
.cd-t.choca,.cd-chip.choca{border-color:var(--warn)}
.cd-choq{color:var(--peli)}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
.kb-col{background:var(--bg2);border:1px solid var(--bor);border-radius:12px;padding:8px;min-height:60px;min-width:0}
.kb-head{font-size:12px;font-weight:900;display:flex;justify-content:space-between;padding:2px 4px 8px}
.kb-head.kb-p{color:var(--pri)}.kb-head.kb-h{color:var(--warn)}.kb-head.kb-d{color:var(--ok)}
.kb-card{background:var(--tar);border:1px solid var(--bor);border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kb-tt{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-sub{font-size:10.5px;color:var(--sub)}
.kb-vacio{font-size:11px;color:var(--sub)}
.kb-acc{display:flex;gap:6px;justify-content:flex-end}
.kb-acc button{background:var(--pri-soft);border:none;color:var(--pri);border-radius:8px;width:30px;height:28px;font-size:14px;font-weight:900;cursor:pointer}
.pom-rel{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0 12px}
.pom-rel b{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
.pom-rel span{font-size:12.5px;color:var(--sub);max-width:92%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-prog{height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-bottom:12px}
.tl-prog i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .3s linear}
.eis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eis{border:1px solid var(--bor);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.eis b{font-size:11.5px;line-height:1.25}
.eis>span{font-size:11px;color:var(--sub)}
.eis .eis-l{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--sub)}
.eis.q3{border-color:var(--peli);background:var(--peli-soft)}
.eis.q2{border-color:var(--pri);background:var(--pri-soft)}
.eis.q1{border-color:var(--warn);background:var(--warn-soft)}
.vt-seg{margin:10px 0 8px;display:flex;gap:6px}
.vt-seg button{flex:0 0 auto;background:var(--tar);border:1px solid var(--bor);border-radius:12px;padding:9px 16px;font-size:13px;font-weight:800;color:var(--sub);cursor:pointer}
.vt-seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
@media(prefers-reduced-motion:reduce){.snack.on{animation:none}}
/* v1.8.0: dialogo de actualizacion (consejos + barra de progreso) */
.act-tips{margin-top:4px}
.act-tips>div{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.45;padding:7px 9px;border-radius:12px;background:var(--pri-soft);margin-bottom:6px;color:var(--txt)}
.act-tip-i{flex-shrink:0}
.act-prog{height:8px;background:var(--bor);border-radius:999px;overflow:hidden;margin-top:10px}
.act-prog i{display:block;height:100%;background:var(--pri);width:0%;transition:width .25s}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="snack" id="snack"></div>
<div class="carga off" id="carga">
  <div class="card">
    <svg viewBox="0 0 140 110" aria-hidden="true">
      <rect class="hoja" x="30" y="14" width="86" height="84" rx="9"/>
      <line class="raya" x1="44" y1="34" x2="104" y2="34"/>
      <line class="raya" x1="44" y1="46" x2="96" y2="46"/>
      <path class="tick" d="M46 72 L56 82 L80 56"/>
      <g class="lapiz">

/* posponer: '1h' | 'manana' | 'libre' (proximo dia con hueco a la misma hora) */
function posponer(id,cuando){
  var t=porId(id);if(!t)return;
  function dd(n){return String(n).padStart(2,'0');}
  var nf=t.fecha,nh=t.hora;
  if(cuando==='1h'){
    var base=(t.fecha&&t.hora)?tsOf(t.fecha,t.hora)+3600000:0;
    if(!base){var z=new Date();z.setMinutes(0,0,0);base=z.getTime()+3600000;}
    if(base<=(new Date()).getTime())base=tsOf(sumar(hoyISO(),1),'09:00');
    var q=new Date(base);nf=iso(q);nh=dd(q.getHours())+':'+dd(q.getMinutes());
  } else if(cuando==='manana'){
    nf=sumar(t.fecha||hoyISO(),1);if(!nh)nh='09:00';
  } else {
    var part=t.fecha||hoyISO(),f=sumar(part,30);
    for(var i=1;i<=30;i++){
      var ff=sumar(part,i);
      var choca=tareasDeDia(ff).some(function(x){return x.id!==t.id&&x.hora&&x.hora===t.hora;});
      if(!choca){f=ff;break;}
    }
    nf=f;if(!nh)nh='09:00';
  }
  function aplicar(puntual){
    t.fecha=nf;t.hora=nh;
    if(puntual)t.rep='';
    guardar();render();
    toast('\u23f1 Pospuesta a '+linda(nf)+(nh?' '+nh:''));
  }
  /* tarea repetida: preguntar cada vez que se pospone ( decision de Manuel, v1.8.6 ) */
  if(t.rep){
    var NOM={diaria:'todos los d\u00edas',laborables:'de lunes a viernes',semanal:'cada semana',quincenal:'cada 2 semanas',mensual:'cada mes'};
    var w=document.createElement('div');w.className='modal';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
    w.innerHTML='<div class="box"><div class="mi warn">\u23f0</div><h4>Tarea repetida</h4>'+
      '<p>'+esc(t.titulo||'')+' se repite '+(NOM[t.rep]||t.rep)+'. La nueva fecha ser\u00eda el '+linda(nf)+(nh?' a las '+nh:'')+'. \u00bfQu\u00e9 hago con la serie?</p>'+
      '<div class="btns"><button class="mno">Volverla puntual</button><button class="msi">Mover la serie</button></div></div>';
    document.body.appendChild(w);
    function cerrarQ(){if(w.parentNode)w.parentNode.removeChild(w);}
    w.querySelector('.msi').onclick=function(){cerrarQ();aplicar(false);};
    w.querySelector('.mno').onclick=function(){cerrarQ();aplicar(true);};
    w.addEventListener('click',function(e){if(e.target===w)cerrarQ();});
    return;
  }
  aplicar(false);
}

    var d=Math.max(0,Math.min(1439,+TL.rango.desde||0)),h=Math.max(0,Math.min(1439,+TL.rango.hasta||0));

/* ---- histograma: barras por tramo de 15 min, apiladas por tipo (estilo ¿Hay Luz?) ---- */
var TL_SLICE=15,TL_TRAMOS=96;
function tlTramos(){
  var d=[],i;
  for(i=0;i<TL_TRAMOS;i++)d.push({mio:0,seg:0,rev:0,total:0});
  tareasDeDia(tlFecha()).forEach(function(x){
    if(!x.hora)return;
    var m=tlMinDe(x.hora);
    var i=Math.min(TL_TRAMOS-1,Math.max(0,Math.floor(m/TL_SLICE)));
    var k=(x.tipo==='seg')?'seg':((x.tipo==='rev')?'rev':'mio');
    d[i][k]++;d[i].total++;
  });
  return d;
}
function tlHistSVG(){
  var d=tlTramos(),max=1,h='';
  d.forEach(function(x){if(x.total>max)max=x.total;});
  var paso=Math.min(78,100/max); /* % de alto por tarea */
  var foco=Math.min(TL_TRAMOS-1,Math.max(0,Math.floor(TL.min/TL_SLICE)));
  TL.focoTramo=foco;
  var tsDia=tareasDeDia(tlFecha());
  d.forEach(function(x,i){
    var y=100,ops='';
    ['rev','seg','mio'].forEach(function(k){
      if(!x[k])return;
      var alt=x[k]*paso;y-=alt;
      ops+='<rect x="'+(i+0.12)+'" y="'+y+'" width="0.76" height="'+alt+'" fill="'+colorTipo(k)+'"/>';
    });
    var t='';
    if(x.total){
      var ts=tsDia.filter(function(z){if(!z.hora)return false;var m=tlMinDe(z.hora);return Math.floor(m/TL_SLICE)===i;});
      t=esc(ts.map(function(z){return z.titulo||'Tarea';}).join(' · '));
    }
    h+='<g data-i="'+i+'" opacity="'+(i===foco?'1':'0.42')+'"'+(t?' title="'+t+'"':'')+'>'+ops+'</g>';
  });
  return h;
}
function tlHistFocus(){

var TL_CIELO=[
  [   0,[ 11, 24, 48],[ 20, 35, 61],[ 34, 52, 76],1   ], /* 00:00 noche cerrada */
  [ 300,[ 11, 24, 48],[ 20, 35, 61],[ 34, 52, 76],1   ], /* 05:00 */

];
function tlCieloDe(m){
  m=((m%1440)+1440)%1440;
  var i,a=null,b=null;
  for(i=0;i<TL_CIELO.length-1;i++){
    if(m>=TL_CIELO[i][0]&&m<=TL_CIELO[i+1][0]){a=TL_CIELO[i];b=TL_CIELO[i+1];break;}
  }
  if(!a){a=TL_CIELO[0];b=TL_CIELO[1];}
  var t=(b[0]===a[0])?0:(m-a[0])/(b[0]-a[0]);
  t=Math.max(0,Math.min(1,t));t=t*t*(3-2*t); /* suaviza el cambio */
  function mix(p,q){return Math.round(p+(q-p)*t);}
  function col(x,y){return [mix(x[0],y[0]),mix(x[1],y[1]),mix(x[2],y[2])];}
  function hex(c){function p(v){return (v<16?'0':'')+v.toString(16);}return '#'+p(c[0])+p(c[1])+p(c[2]);}
  return {top:hex(col(a[1],b[1])),mid:hex(col(a[2],b[2])),bot:hex(col(a[3],b[3])),n:a[4]+(b[4]-a[4])*t};
}
function tlDiaNoche(inmediato){
  var el=$('tl');if(!el)return;
  var c=el.querySelector('.cielo');if(!c)return;
  var m=TL.min,k=tlCieloDe(m);
  c.style.background='linear-gradient(180deg,'+k.top+' 0%,'+k.mid+' 46%,'+k.bot+' 100%)';
  var n=k.n;
  function op(sel,v){var g=el.querySelectorAll(sel);for(var i=0;i<g.length;i++)g[i].setAttribute('opacity',String(v));}
  /* el sol sale sobre las 6 y se pone sobre las 20; la luna hace lo contrario */
  var solOp;
  if(m<330||m>1200)solOp=0;
  else if(m<420)solOp=(m-330)/90;
  else if(m<1080)solOp=1;
  else solOp=1-(m-1080)/120;
  solOp=Math.max(0,Math.min(1,solOp));
  op('.sol',solOp);
  op('.estrellas',n*0.9);
  op('.luna',Math.max(0,1-solOp));
  op('.luces',n);
  var sol=el.querySelector('.sol'),luna=el.querySelector('.luna');
  var ps=Math.max(0,Math.min(1,(m-360)/720));
  if(sol)sol.setAttribute('transform','translate('+(80+ps*1040-930)+','+(96-Math.sin(ps*Math.PI)*70-52)+')');
  var pm=(((m-1080)+1440)%1440)/720;
  if(luna)luna.setAttribute('transform','translate('+(80+pm*1040-930)+','+(96-Math.sin(pm*Math.PI)*70-48)+')');
  var sombra=el.querySelector('.lunaSombra');if(sombra)sombra.setAttribute('fill',k.top);
}

/* --- conflictos de horario (pt.2) --- */
function horaMinutos(h){var p=String(h||'').split(':');if(p.length<2)return null;
  var m=(+p[0])*60+(+p[1]);return isNaN(m)?null:m;}
function durDe(t){return (+t.dur>0)?+t.dur:60;}
function choquesDeDia(f){
  var ts=tareasDeDia(f).filter(function(t){return horaMinutos(t.hora)!==null&&!t.hecha;});
  ts.sort(function(a,b){return horaMinutos(a.hora)-horaMinutos(b.hora);});
  var ch={};
  for(var i=1;i<ts.length;i++){
    var ini=horaMinutos(ts[i].hora),finAnt=horaMinutos(ts[i-1].hora)+durDe(ts[i-1]);
    if(ini<finAnt){ch[ts[i].id]=ts[i-1].id;ch[ts[i-1].id]=ts[i-1].id;}
  }
  return ch;
}
function tareaChoca(t){
  if(t.hecha||t.__oc)return null;
  if(!t.fecha||horaMinutos(t.hora)===null)return null;
  var otro=choquesDeDia(t.fecha)[t.id];
  return otro?porId(otro):null;
}
function conflictoDe(f,hora,dur,excl){
  var ini=horaMinutos(hora);if(ini===null)return null;
  dur=dur||60;var fin=ini+dur;
  var ts=tareasDeDia(f);
  for(var i=0;i<ts.length;i++){
    var t=ts[i];
    if(t.hecha||(excl&&t.id===excl))continue;
    var hi=horaMinutos(t.hora);if(hi===null)continue;
    if(ini<hf_(hi,t)&&fin>hi)return t;
  }
  return null;
  function hf_(hi,t){return hi+durDe(t);}
}
function proximaHoraLibre(f,hora,dur,excl){
  dur=dur||60;
  var ocup=[],ts=tareasDeDia(f);
  ts.forEach(function(t){
    if((excl&&t.id===excl)||t.hecha)return;
    var hi=horaMinutos(t.hora);if(hi===null)return;
    ocup.push({i:hi,f:hi+Math.max(durDe(t),15)});});
  var ini=horaMinutos(hora)||0,pasos=0;
  while(ini+dur<=1440&&pasos<500){
    var choca=null;
    ocup.forEach(function(o){if(ini<o.f&&ini+dur>o.i){if(!choca||o.f<choca)choca=o.f;}});
    if(!choca)break;
    ini=Math.ceil(choca/15)*15;pasos++;
  }
  if(ini+dur>1440)ini=Math.max(0,1440-dur);
  return String(Math.floor(ini/60)).padStart(2,'0')+':'+String(ini%60).padStart(2,'0');
}
function huecoDesde(f,desde,dur){
  dur=dur||60;
  var ocup=[];
  U().tareas.forEach(function(t){
    if(t.hecha||t.fecha!==f)return;
    var hi=horaMinutos(t.hora);if(hi===null)return;
    ocup.push({i:hi,f:hi+Math.max(durDe(t),15)});});
  var ini=Math.max(0,desde),pasos=0;
  while(ini+dur<=1440&&pasos<500){
    var choca=null;
    ocup.forEach(function(o){if(ini<o.f&&ini+dur>o.i){if(!choca||o.f<choca)choca=o.f;}});
    if(!choca)break;
    ini=Math.ceil(choca/15)*15;pasos++;
  }
  if(ini+dur>1440)return '';
  return String(Math.floor(ini/60)).padStart(2,'0')+':'+String(ini%60).padStart(2,'0');
}

/* --- lenguaje natural (pt.13.1) --- */
var DIAS_NAT={lunes:1,martes:2,miercoles:3,'miércoles':3,jueves:4,viernes:5,sabado:6,'sábado':6,domingo:0};
function parseNatural(texto){
  var r={titulo:'',fecha:'',hora:'',pri:'',tags:[],rep:''};
  var h=hoyISO();
  var tokens=String(texto||'').split(/\s+/);
  var queda=[],serie=false;
  function lim(x){return String(x).toLowerCase().replace(/[.,!¡?¿]+/g,'');}
  for(var i=0;i<tokens.length;i++){
    var l=lim(tokens[i]);
    if(!l)continue;
    if(l.charAt(0)==='#'&&l.length>1){r.tags.push(l.slice(1));continue;}
    if(l==='urgente'||l==='alta'){r.pri='alta';continue;}
    if(l==='baja'){r.pri='baja';continue;}
    if(l==='hoy'){r.fecha=h;continue;}
    if(l==='mañana'||l==='manana'){r.fecha=sumar(h,1);continue;}
    if(l==='pasado'&&tokens[i+1]&&(lim(tokens[i+1])==='mañana'||lim(tokens[i+1])==='manana')){r.fecha=sumar(h,2);i++;continue;}
    if(l==='todos'||l==='cada'||l==='todas'){
      var n1=tokens[i+1]?lim(tokens[i+1]):'';
      if(n1==='los'||n1==='las'||n1==='el'||n1==='la')i++;
      serie=true;continue;}
    if(Object.prototype.hasOwnProperty.call(DIAS_NAT,l)){
      var dif=(DIAS_NAT[l]-parse(h).getDay()+7)%7;
      if(dif===0)dif=serie?0:7;
      r.fecha=sumar(h,dif);
      if(serie)r.rep='semanal';
      serie=false;continue;}
    if(l==='el'&&tokens[i+1]){
      var nn=lim(tokens[i+1]).match(/^(\d{1,2})$/);
      if(nn){var nd=+nn[1],dH=new Date();
        if(nd<dH.getDate()){var m2=dH.getMonth()+1;if(m2>11){m2=0;dH.setFullYear(dH.getFullYear()+1);}
          r.fecha=iso(new Date(dH.getFullYear(),m2,nd));}
        else r.fecha=iso(new Date(dH.getFullYear(),dH.getMonth(),nd));
        i++;continue;}}
    var mfd=l.match(/^(\d{1,2})\/(\d{1,2})$/);
    if(mfd){r.fecha=iso(new Date(new Date().getFullYear(),+mfd[2]-1,+mfd[1]));continue;}
    if(l==='a'&&tokens[i+1]){var nn1=lim(tokens[i+1]);if(nn1==='las'||nn1==='la'){l='las';i++;}}
    if(l==='las'||l==='la'){
      var cand=tokens[i+1]?lim(tokens[i+1]):'';
      var m4=cand.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
      if(m4){var hh=+m4[1];if(m4[3]==='pm'&&hh<12)hh+=12;
        if(hh<24){r.hora=String(Math.min(23,hh)).padStart(2,'0')+':'+(m4[2]||'00');i++;continue;}}}
    var m2=l.match(/^(\d{1,2}):(\d{2})(am|pm)?$/);
    if(m2){var hh2=+m2[1];if(m2[3]==='pm'&&hh2<12)hh2+=12;
      if(hh2<24){r.hora=String(hh2).padStart(2,'0')+':'+m2[2];continue;}}
    var m3=l.match(/^(\d{1,2})(am|pm|h)$/);
    if(m3){var hh3=+m3[1];if(m3[2]==='pm'&&hh3<12)hh3+=12;
      r.hora=String(Math.min(23,hh3)).padStart(2,'0')+':00';continue;}
    queda.push(tokens[i]);
  }
  r.titulo=queda.join(' ').trim();
  return r;
}

/* v1.9.0: soltar una tarjeta en una columna concreta del tablero (drag por toque) */
function kanbanSuelta(id,col){
  var t=porId(id);if(!t)return;var h=hoyISO();
  if(col===2){ /* Hecha */
    if(t.hecha)return;
    t.hecha=true;t.cumplida=hoyISO();cumplirCal(t);guardar();render();toast('\u2714 Marcada como cumplida');
  } else if(col===1){ /* Hoy */
    if(t.hecha){t.hecha=false;t.cumplida='';guardar();render();}
    if(!t.fecha||t.fecha>h||t.hecha){t.fecha=h;t.inbox=false;guardar();render();toast('Movida a Hoy');}
  } else { /* Pendiente: sin fecha (o indicacion) y no hecha */
    if(t.hecha){t.hecha=false;t.cumplida='';t.fecha='';guardar();render();toast('Devuelta a pendientes');return;}
    if(t.fecha&&t.fecha<=h){var d=t.fecha;t.fecha='';guardar();render();
      snackbar('Sin fecha: queda pendiente','Deshacer',function(){t.fecha=d;guardar();render();});}
  }
}
/* arrastre: pulsar largo levanta la tarjeta; mover marca la columna destino; soltar aplica */
function initKanbanDrag(){
  var cols=[].slice.call(document.querySelectorAll('.kb-body'));
  if(cols.length<3)return;
  var rects=null,drag=null;
  function rectsOf(){rects=cols.map(function(c){return c.getBoundingClientRect();});}
  function colEn(x,y){
    for(var i=0;i<3;i++){var r=rects[i];if(x>=r.left-10&&x<=r.right+10&&y>=r.top-46)return i;}
    return -1;
  }
  [].slice.call(document.querySelectorAll('.kb-card[data-kb-id]')).forEach(function(card){
    var id=+card.getAttribute('data-kb-id'),tid=0,sx=0,sy=0,live=false;
    card.addEventListener('touchstart',function(e){
      if(e.touches.length!==1)return;
      var T=e.touches[0];sx=T.clientX;sy=T.clientY;live=false;
      tid=setTimeout(function(){
        if(drag)return;
        drag=card;card.classList.add('lift');rectsOf();live=true;
        try{if(navigator.vibrate)navigator.vibrate(15);}catch(err){}
      },260);
    },{passive:true});
    card.addEventListener('touchmove',function(e){
      if(!live){var T=e.touches[0];
        if(Math.abs(T.clientX-sx)>12||Math.abs(T.clientY-sy)>12)clearTimeout(tid);
        return;}
      if(!drag||!rects)return;
      if(e.cancelable)e.preventDefault();
      var col=colEn(e.touches[0].clientX,e.touches[0].clientY);
      cols.forEach(function(c,i){c.classList.toggle('drop-on',i===col);});
    },{passive:false});
    card.addEventListener('touchend',function(e){
      clearTimeout(tid);
      if(!drag||drag!==card)return;
      var T=e.changedTouches&&e.changedTouches[0];
      var col=(rects&&T)?colEn(T.clientX,T.clientY):-1;
      drag.classList.remove('lift');drag=null;
      cols.forEach(function(c){c.classList.remove('drop-on');});
      if(col>=0)kanbanSuelta(id,col);
    });
    card.addEventListener('touchcancel',function(){
      clearTimeout(tid);
      if(drag===card){drag.classList.remove('lift');drag=null;}
      cols.forEach(function(c){c.classList.remove('drop-on');});
    });
  });
}
function kanbanMueve(id,dir){

    if(t.hecha){toast('Ya está cumplida');return;}

    else{t.hecha=true;t.cumplida=hoyISO();cumplirCal(t);guardar();render();toast('✔ Marcada como cumplida');}
  }else{
    if(t.hecha){t.hecha=false;t.cumplida='';guardar();render();snackbar('Devuelta a pendientes','Deshacer',function(){
      t.hecha=true;t.cumplida=hoyISO();guardar();render();});}
    else if(t.fecha&&t.fecha<=h){t.fecha=sumar(h,1);guardar();render();toast('Movida a mañana');}
    else if(t.fecha){t.fecha='';guardar();render();snackbar('Sin fecha: queda pendiente','Deshacer',function(){
      t.fecha=h;guardar();render();});}
  }
}

var POM={int:null,seg:0,modo:'trabajo',id:0};
function pomodoroCerrar(){if(POM.int){clearInterval(POM.int);POM.int=null;}POM.id=0;}
function pomodoroPinta(){
  var el=$('pom-t');if(!el)return;
  el.textContent=String(Math.floor(POM.seg/60)).padStart(2,'0')+':'+String(POM.seg%60).padStart(2,'0');
  var bar=$('pom-bar'),total=(POM.modo==='trabajo'?25:5)*60;
  if(bar)bar.style.width=Math.round((total-POM.seg)*100/total)+'%';
}
function pomodoroAviso(titulo,texto){

}
function pomodoroIniciar(id){
  var t=porId(id);if(!t)return;
  pomodoroCerrar();POM.id=id;POM.modo='trabajo';POM.seg=25*60;
  $('overlay').innerHTML='<div class="overlay" role="dialog" aria-modal="true"><div class="sheet"><div class="grab"></div>'+

    '<div class="tl-prog"><i id="pom-bar" style="width:0%"></i></div>'+

    '<button class="btn sec" id="ov-close" style="margin-top:10px">Terminar</button></div></div>';

  $('ov-close').addEventListener('click',cerrarOverlay);
  $('pom-skip').addEventListener('click',function(){
    if(POM.modo==='trabajo'){POM.modo='pausa';POM.seg=5*60;var h=$('pom-h');if(h)h.textContent='☕ Pausa: 5 min';pomodoroPinta();}
    else{pomodoroCerrar();cerrarOverlay();toast('Pomodoro terminado');}});
  POM.int=setInterval(function(){
    POM.seg--;if(POM.seg<0)POM.seg=0;
    pomodoroPinta();
    if(POM.seg>0)return;
    if(POM.modo==='trabajo'){
      POM.modo='pausa';POM.seg=5*60;
      var h2=$('pom-h');if(h2)h2.textContent='☕ Pausa: 5 min';
      pomodoroAviso('🍅 25 min hechos','Toca 5 min de pausa');toast('🍅 25 min hechos · pausa de 5 min');
    }else{
      pomodoroCerrar();pomodoroAviso('🍅 Pomodoro completo','Buen trabajo');
      toast('🍅 Pomodoro completo');cerrarOverlay();
    }
  },1000);
}

var snackT=null,snackCb=null;
function snackbar(msg,etiqueta,cb){
  var s=$('snack');if(!s){toast(msg);return;}
  snackCb=cb||null;
  s.innerHTML='<span>'+esc(msg)+'</span>'+(snackCb?'<button type="button" id="snack-undo">'+esc(etiqueta||'Deshacer')+'</button>':'');
  s.classList.add('on');
  clearTimeout(snackT);
  snackT=setTimeout(function(){s.classList.remove('on');snackCb=null;},5000);
  var b=$('snack-undo');
  if(b&&!b.__ev){b.__ev=1;b.addEventListener('click',function(){
    clearTimeout(snackT);s.classList.remove('on');
    var f=snackCb;snackCb=null;if(f)f();});}
}

function cargaEquipo(){
  var out=U().responsables.map(function(r){
    var pen=U().tareas.filter(function(t){
      if(t.hecha)return false;
      if(+t.principal===+r.id)return true;
      return (t.participantes||[]).some(function(p){return +p===+r.id;});
    });
    return {
      r:r,
      pen:pen.length,
      venc:pen.filter(vencida).length,
      rev:pen.filter(function(t){return t.tipo==='rev';}).length

  out.sort(function(a,b){return b.pen-a.pen||b.venc-a.venc;});

/* próxima tarea de hoy que todavía no ha llegado (tarjeta «Ahora») */
function proximaHoy(){
  var h=hoyISO(),d=new Date(),m=d.getHours()*60+d.getMinutes(),best=null;
  U().tareas.forEach(function(t){
    if(t.hecha||t.fecha!==h||!t.hora)return;
    var p=String(t.hora).split(':');if(p.length<2)return;
    var tm=(+p[0])*60+(+p[1]);if(isNaN(tm)||tm<m)return;
    if(!best||tm<best.tm)best={t:t,tm:tm};
  });
  return best;
}

function calFechaActiva(){return S.ui.calFecha||hoyISO();}

/* la semana empieza en lunes: 0 = lunes … 6 = domingo */
function calInicioSemana(f){return sumar(f,-((parse(f).getDay()+6)%7));}
function calOrden(ts){
  return ts.slice().sort(function(a,b){
    var ha=a.hora||'99:99',hb=b.hora||'99:99';

function calDiaLbl(f){var d=parse(f);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESE[d.getMonth()].slice(0,3);}
function calSemanaNum(f){

function calHoraFin(hora,dur){
  var p=(hora||'09:00').split(':'),t=(+p[0]||0)*60+(+p[1]||0)+(+dur||0);
  t=((t%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function calTareaMini(t){
  var sub=[],pr=respPorId(t.principal);
  var choq=tareaChoca(t);if(choq&&!t.hecha)sub.push('⚠ Choca con '+(choq.titulo||'otra'));
  if(t.hora)sub.push(t.hora+(t.dur?'–'+calHoraFin(t.hora,t.dur):''));
  if(pr)sub.push(pr.nombre);
  if(t.pri==='alta')sub.push('⚡ Alta');
  if(t.hecha)sub.push('✔ Cumplida');
  if(t.rep)sub.push('🔁 '+(REP_NOMBRES[t.rep]||''));
  var oc=t.__oc?' data-oc="'+t.fecha+'"':'';
  return '<button type="button" class="cd-t'+(t.hecha?' hecha':'')+(choq&&!t.hecha?' choca':'')+'" data-tarea="'+t.id+'"'+oc+' style="--tc:'+colorTipo(t)+'">'+
    '<span class="cd-chk'+(t.hecha?' on':'')+'" data-check="'+t.id+'"'+oc+' role="button" tabindex="-1" aria-label="Marcar como cumplida"></span>'+
    '<span class="cd-tt">'+esc(t.titulo||'Nota de voz')+'</span>'+
    (sub.length?'<span class="cd-sub">'+esc(sub.join(' · '))+'</span>':'')+'</button>';
}
function calPips(f){
  var ts=tareasDeDia(f),p='';
  ts.slice(0,3).forEach(function(t){p+='<i style="background:'+colorTipo(t)+(t.hecha?';opacity:.5':'')+'"></i>';});
  if(U().tareas.some(function(t){return !t.hecha&&t.rec===f;}))p+='<i style="background:var(--warn)"></i>';
  return p;
}
function calTareasRango(desde,hasta){
  var out=[],f=desde,paso=0;
  while(f&&f<=hasta&&paso<800){out=out.concat(tareasDeDia(f));f=sumar(f,1);paso++;}
  return out;
}
function calEnHoy(){
  var v=S.ui.calVista||'mes',d=new Date();
  if(v==='dia')return calFechaActiva()===hoyISO();
  if(v==='semana')return calInicioSemana(calFechaActiva())===calInicioSemana(hoyISO());
  if(v==='anio')return S.ui.calAnio===d.getFullYear();
  return S.ui.calAnio===d.getFullYear()&&S.ui.calMes===d.getMonth();
}
function calTituloHTML(){
  var v=S.ui.calVista||'mes';
  if(v==='dia'){
    var d=parse(calFechaActiva());
    return '<div class="ct-l"><span class="ct-m">'+DIAS[d.getDay()]+', '+d.getDate()+' de '+MESE[d.getMonth()]+'</span>'+
      '<span class="ct-a">'+d.getFullYear()+' · Semana '+calSemanaNum(calFechaActiva())+'</span></div>';
  }
  if(v==='semana'){
    var a=calInicioSemana(calFechaActiva()),af=parse(a),bf=parse(sumar(a,6)),t;
    if(af.getFullYear()!==bf.getFullYear()){
      t=af.getDate()+' '+MESE[af.getMonth()].slice(0,3)+' '+af.getFullYear()+' – '+bf.getDate()+' '+MESE[bf.getMonth()].slice(0,3)+' '+bf.getFullYear();
    }else if(af.getMonth()!==bf.getMonth()){
      t=af.getDate()+' '+MESE[af.getMonth()].slice(0,3)+' – '+bf.getDate()+' '+MESE[bf.getMonth()].slice(0,3);
    }else{
      t=af.getDate()+' – '+bf.getDate()+' de '+MESE[af.getMonth()];
    }
    return '<div class="ct-l"><span class="ct-m">'+t+'</span><span class="ct-a">Semana '+calSemanaNum(a)+' · '+af.getFullYear()+'</span></div>';
  }
  if(v==='anio')return '<div class="ct-l"><span class="ct-m">'+S.ui.calAnio+'</span><span class="ct-a">12 meses</span></div>';
  return '<div class="ct-l"><span class="ct-m">'+MESE[S.ui.calMes]+'</span><span class="ct-a">'+S.ui.calAnio+'</span></div>';
}
function calMesGridHTML(anio,mes){
  var primero=new Date(anio,mes,1).getDay();
  var diasMes=new Date(anio,mes+1,0).getDate();
  var prevDias=new Date(anio,mes,0).getDate();
  var h=hoyISO(),celdas='',mesT=0,semIni=calInicioSemana(h),semFin=sumar(semIni,6);
  for(var i=0;i<primero;i++)celdas+='<div class="cel out">'+(prevDias-primero+1+i)+'</div>';
  for(var d=1;d<=diasMes;d++){
    var f=anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var ts=tareasDeDia(f);mesT+=ts.length;
    var dow=new Date(anio,mes,d).getDay(),enSem=(f>=semIni&&f<=semFin);
    var alta=ts.some(function(t){return t.pri==='alta'&&!t.hecha;});
    celdas+='<div class="cel'+(f===h?' hoy':'')+(enSem?' semana-hoy':'')+((dow===0||dow===6)?' finde':'')+'" data-dia="'+f+'" role="button" tabindex="0" aria-label="'+calDiaLbl(f)+(ts.length?', '+ts.length+' tarea'+(ts.length===1?'':'s'):', sin tareas')+'">'+d+
      (alta?'<span class="alta">⚡</span>':'')+
      (ts.length?'<span class="cnt">'+ts.length+'</span>':'')+
      '<span class="pips">'+calPips(f)+'</span></div>';
  }
  var resto=(7-((primero+diasMes)%7))%7;
  for(var k=1;k<=resto;k++)celdas+='<div class="cel out">'+k+'</div>';
  return {html:celdas,total:mesT};
}

    '<div class="cd-ring" style="--p:'+pct+'"><div class="in"><b>'+pct+'%</b><span>hecho</span></div></div></div>'+
    '<div class="cd-kpis"><span><b>'+pend+'</b> pendientes</span><span><b>'+hechas+'</b> cumplidas</span><span><b>'+planLbl+'</b> planeadas'+(cargaF>480?' <b class="cd-choq">⚠ sobrecargado</b>':'')+'</span></div>'+
    '<div class="tar cal-dia"><div class="cal-gh"><span class="cgd">Todo el día</span><span class="cgn">'+(sinHora.length?sinHora.length+' sin hora':'ninguna')+'</span>'+
      '<button type="button" class="cg-add" data-add-dia="'+f+'" aria-label="Añadir tarea sin hora">＋</button></div>'+
      '<div class="cd-allday">'+todoDia+'</div>'+

function calAgendaHTML(){
  var v=S.ui.calVista||'mes';
  if(v==='dia')return calDiaHTML();
  if(v==='semana'){
    var ini=calInicioSemana(calFechaActiva()),s2='<div class="tar cal-agenda"><div class="cal-gh"><span class="cgd">Agenda de la semana</span>'+
      '<button type="button" class="cg-add" data-agenda-sem="'+ini+'" aria-label="Enviar la agenda de la semana por WhatsApp" title="Enviar la agenda de la semana por WhatsApp">📤</button></div>';
    for(var i=0;i<7;i++)s2+=calGrupoHTML(sumar(ini,i),tareasDeDia(sumar(ini,i)),true);
    return s2+'</div>';
  }
  if(v==='anio')return calAnioResumenHTML();
  var anio=S.ui.calAnio,mes=S.ui.calMes,dias=new Date(anio,mes+1,0).getDate(),s3='',tot=0;
  for(var d=1;d<=dias;d++){
    var f3=anio+'-'+String(mes+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

    if(ts3.length){s3+=calGrupoHTML(f3,ts3,false);tot+=ts3.length;}
  }
  return '<div class="tar cal-agenda"><div class="cal-gh" style="margin-bottom:2px">'+
    '<span class="cgd">Tareas de '+MESE[mes]+'</span><span class="cgn">'+tot+'</span></div>'+
    (s3||'<div class="cal-vacio"><div class="cv-i">🗓</div><b>Mes sin tareas</b><span>Toca un día del calendario para abrirlo y añadir tareas.</span></div>')+
    '</div>';
}
/* buscador de la agenda: filtra por título, nota y responsable; agrupa por fecha */
function calBusquedaHTML(){
  var q=(S.ui.calQ||'').toLowerCase().trim();
  if(!q)return '';
  var ts=U().tareas.filter(function(t){
    if(esIndic(t))return false;
    return (t.titulo||'').toLowerCase().indexOf(q)>=0||(t.nota||'').toLowerCase().indexOf(q)>=0||nomResp(t.principal).toLowerCase().indexOf(q)>=0;});
  ts.sort(function(a,b){var fa=a.fecha||'9999',fb=b.fecha||'9999';return fa<fb?-1:1;});
  if(!ts.length)return '<div class="vacio">Sin resultados para «'+esc(S.ui.calQ)+'».</div>';
  var grupos={},orden=[];
  ts.forEach(function(t){var f=t.fecha;if(!grupos[f]){grupos[f]=[];orden.push(f);}grupos[f].push(t);});
  return orden.map(function(f){return calGrupoHTML(f,grupos[f],false);}).join('');
}

function calNav(dir){
  var v=S.ui.calVista||'mes';
  if(v==='dia'){S.ui.calFecha=sumar(calFechaActiva(),dir);calSyncMes();}
  else if(v==='semana'){S.ui.calFecha=sumar(calFechaActiva(),7*dir);calSyncMes();}
  else if(v==='anio'){S.ui.calAnio=(S.ui.calAnio||new Date().getFullYear())+dir;}
  else{
    var m=(S.ui.calMes||0)+dir,a=S.ui.calAnio;
    if(m<0){m=11;a--;}else if(m>11){m=0;a++;}
    S.ui.calMes=m;S.ui.calAnio=a;
  }
  guardar();render();
}
function calIrHoy(){
  var d=new Date();
  S.ui.calFecha=hoyISO();S.ui.calAnio=d.getFullYear();S.ui.calMes=d.getMonth();
  guardar();render();
}
function calCambiarVista(v){
  var prev=S.ui.calVista||'mes';
  if((v==='dia'||v==='semana')&&prev!=='dia'&&prev!=='semana'){
    var h=new Date(),f=S.ui.calFecha?parse(S.ui.calFecha):null;
    if(!f||f.getFullYear()!==S.ui.calAnio||f.getMonth()!==S.ui.calMes){
      if(prev==='mes'){
        S.ui.calFecha=(h.getFullYear()===S.ui.calAnio&&h.getMonth()===S.ui.calMes)?hoyISO():S.ui.calAnio+'-'+String(S.ui.calMes+1).padStart(2,'0')+'-01';
      }else{
        S.ui.calFecha=(h.getFullYear()===S.ui.calAnio)?hoyISO():S.ui.calAnio+'-01-01';
      }
    }
  }
  S.ui.calVista=v;
  if(v==='dia'||v==='semana')calSyncMes();
  guardar();render();
  try{window.scrollTo(0,0);}catch(e){}
}

function fmtDur(s){s=Math.max(0,+s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
var audioUrls={};
function audioSrc(d){
  if(!d)return '';
  if(d.indexOf('data:')!==0)return d;
  if(audioUrls[d])return audioUrls[d];
  try{
    var p=d.indexOf(','),meta=d.slice(5,p),b64=d.slice(p+1);
    var mime=(meta.split(';')[0]||'audio/mp4');
    var bin=atob(b64),arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:mime}));
    audioUrls[d]=url;return url;
  }catch(e){return d;}
}

  '<h3>📤 Mandar tareas por WhatsApp</h3>'+

  '<p>Con una <b>nota de voz</b> el envío va por el selector de archivos de WhatsApp (el móvil no permite mandar un archivo a un número concreto): elige el contacto y listo.</p>'+

  '<p><b>Crear al vuelo:</b> dentro del formulario de tarea, «＋ Crear responsable nuevo aquí» abre un mini-formulario; al darle <i>Crear y asignar</i> la persona queda ya como responsable principal <b>sin perder lo que tenías escrito</b> en la tarea.</p>'+

  '<h3>🔁 Tareas que se repiten</h3>'+

  '<h3>✅ Cumplir sin borrar</h3>'+

  '<p>La campana 🔔 de la barra superior resume lo que necesita atención. Además, la app <b>programa notificaciones en el dispositivo</b> para las fechas/horas de tus tareas y recordatorios: <b>te avisan aunque la app esté cerrada</b>. Permite los permisos de notificación cuando te lo pida.</p>'+
  '<p>El <b>micrófono</b> (para las notas de voz) también se activa desde <b>Ajustes → 🎤 Activar micrófono</b>, sin necesidad de abrir una tarea.</p>'+

/* foto del responsable: recorta al centro y la deja en miniatura 160x160 */
function procesarFotoResp(file,id){
  var r=respPorId(id);if(!r){toast('El responsable ya no existe');return;}
  var fr=new FileReader();
  fr.onload=function(e){
    var img=new Image();
    img.onload=function(){
      try{
        var L=160,cn=document.createElement('canvas');cn.width=L;cn.height=L;
        var ctx=cn.getContext('2d');
        var w=img.width||L,h=img.height||L,side=Math.min(w,h);
        ctx.drawImage(img,(w-side)/2,(h-side)/2,side,side,0,0,L,L);
        var data=cn.toDataURL('image/jpeg',0.72);
        var rr=respPorId(id);
        if(rr&&data&&data.indexOf('data:image/jpeg')===0){rr.foto=data;guardar();render();toast('Foto guardada');}
        else toast('No se pudo procesar la foto');
      }catch(err){toast('No se pudo procesar la foto');}
    };
    img.onerror=function(){toast('No se pudo abrir la imagen');};
    img.src=e.target.result;
  };
  fr.onerror=function(){toast('No se pudo leer la imagen');};
  try{fr.readAsDataURL(file);}catch(e){toast('No se pudo leer la imagen');}
}

function mostrarHojaContactos(lista,cb){
  $('overlay').innerHTML='<div class="overlay" role="dialog" aria-modal="true"><div class="sheet"><div class="grab"></div>'+
    '<h3>📇 Contactos del móvil</h3>'+
    '<input id="ct-buscar" type="text" placeholder="🔎 Buscar por nombre o número…" style="margin-bottom:6px">'+
    '<div id="ct-info" style="font-size:12px;color:var(--sub);margin:0 0 8px"></div>'+
    '<div id="ct-lista" style="max-height:48vh;overflow-y:auto"></div>'+
    '<button class="btn sec" id="ov-close" style="margin-top:12px">Cancelar</button></div></div>';
  var ov=document.querySelector('.overlay');if(ov)ov.addEventListener('click',function(e){if(e.target===this)cerrarOverlay();});
  $('ov-close').addEventListener('click',cerrarOverlay);
  var PAG=150,pintados=0,encontrados=[];
  function filtrar(){
    var q=(($('ct-buscar')||{}).value||'').trim().toLowerCase();
    encontrados=[];
    for(var i=0;i<lista.length;i++){
      var c=lista[i]||{};var n=(c.nombre||'').toLowerCase(),t=(c.tel||'').toLowerCase();
      if(!q||n.indexOf(q)>=0||t.indexOf(q)>=0)encontrados.push(c);
    }
    pintados=0;
    var caja=$('ct-lista');if(caja)caja.innerHTML='';
    pintar();
  }
  /* se pintan de 150 en 150 y se siguen cargando al bajar en la lista:
     asi se pueden ver miles de contactos sin que la app se atasque */
  function pintar(){
    var cont=$('ct-lista');if(!cont)return;
    var fin=Math.min(pintados+PAG,encontrados.length),frag='';
    for(var i=pintados;i<fin;i++){
      var c=encontrados[i]||{};
      var num=(c.tel||'').trim();
      var et=num;
      if(!et)et='sin teléfono';
      else if(c.tipo==='movil')et='📱 '+et;
      else if(c.tipo==='fijo')et='☎️ '+et;
      frag+='<button class="ct-item" data-n="'+esc(c.nombre||'')+'" data-t="'+esc(num)+'">'+
        '<b>'+esc(c.nombre||'')+'</b><span>'+esc(et)+'</span></button>';
    }
    if(fin>pintados)cont.insertAdjacentHTML('beforeend',frag);
    pintados=fin;
    var info=$('ct-info');
    if(info){
      if(!encontrados.length)info.textContent='Sin coincidencias';
      else if(pintados<encontrados.length)info.textContent='Mostrando '+pintados+' de '+encontrados.length+' contactos';
      else info.textContent=encontrados.length+' contactos';
    }
  }
  var bs=$('ct-buscar');if(bs)bs.addEventListener('input',filtrar);
  var caja=$('ct-lista');
  if(caja){
    caja.addEventListener('scroll',function(){
      if(caja.scrollTop+caja.clientHeight>=caja.scrollHeight-150)pintar();
    });
    /* un solo listener para todas las filas (delegacion): no hay que volver
       a enganchar los botones cada vez que se pintan mas */
    caja.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('.ct-item'):null;if(!b)return;
      cerrarOverlay();
      cb({nombre:b.getAttribute('data-n'),tel:b.getAttribute('data-t')});
    });
  }
  filtrar();
}

      '<div class="pk-wheels"><div class="pk-col" data-pk="h" id="pk-h">'+hb+'</div>'+

/* ---- grouped tasks by responsible (send list by WhatsApp) ---- */
function tareasDeResp(id,incluirCumplidas){
  return U().tareas.filter(function(t){
    if(!incluirCumplidas&&t.hecha)return false;
    if(+t.principal===+id)return true;
    return (t.participantes||[]).some(function(p){return +p===+id;});
  }).sort(function(a,b){
    var fa=a.fecha||('9'+(a.rec||'')),fb=b.fecha||('9'+(b.rec||''));return fa<fb?-1:fa>fb?1:-1;
  });
}

function textoGrupo(r){

/* modal premium de confirmación (sustituye a confirm() nativo) */
function modalOp(o){
  var w=document.createElement('div');w.className='modal';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
  w.innerHTML='<div class="box"><div class="mi '+(o.ic||'warn')+'">'+(o.icono||'⚠️')+'</div>'+
    '<h4>'+esc(o.titulo)+'</h4><p>'+esc(o.texto)+'</p>'+
    '<div class="btns"><button class="mno">'+esc(o.no||'Cancelar')+'</button>'+
    '<button class="msi '+(o.siCls||'')+'">'+esc(o.si||'Aceptar')+'</button></div></div>';
  document.body.appendChild(w);
  function fin(r){if(w.parentNode)w.parentNode.removeChild(w);if(o.cb)o.cb(r);}
  w.querySelector('.mno').onclick=function(){fin(false);};
  w.querySelector('.msi').onclick=function(){fin(true);};
  w.addEventListener('click',function(e){if(e.target===w)fin(false);});
  return w;
}
function confirmar(titulo,texto,o,cb){
  if(typeof o==='function'){cb=o;o={};}
  o=o||{};
  modalOp({icono:o.icono,ic:o.ic,titulo:titulo,texto:texto,si:o.si||'Confirmar',
    siCls:o.siCls||'',no:o.no||'Cancelar',cb:cb});
}

/* swipe eliminar (se puede llamar varias veces: cada tarjeta se engancha una sola vez) */
function initSwipe(q){
  (q||document).querySelectorAll('.swipe').forEach(function(w){
    if(w.__swipeOn)return;w.__swipeOn=true;
    var tarea=w.querySelector('.tarea'),prog=w.querySelector('.swipe-prog');
    if(!tarea||!prog)return;
    var id=+w.getAttribute('data-id');
    var startX=0,startY=0,cur=0,max=1,active=false,drag=false,decided=false;
    function reset(){tarea.style.transform='translateX(0)';prog.style.width='0%';}
    tarea.addEventListener('pointerdown',function(e){
      if(e.target.closest('button,audio'))return;
      active=true;drag=false;decided=false;cur=0;startX=e.clientX;startY=e.clientY;
      max=Math.max(tarea.offsetWidth,1);tarea.style.transition='none';
    });
    tarea.addEventListener('pointermove',function(e){
      if(!active)return;
      var dx=startX-e.clientX,dy=Math.abs(e.clientY-startY);
      if(!decided){ if(dx<6&&dy<6)return; decided=true;
        if(dy>dx){active=false;tarea.style.transition='';return;} drag=true;
        try{tarea.setPointerCapture(e.pointerId);}catch(err){} }
      if(!drag)return;
      if(dx<0)dx=0;var tope=max*0.9;cur=Math.min(dx,tope);
      tarea.style.transform='translateX('+(-cur)+'px)';
      prog.style.width=(cur/tope*100)+'%';
    });
    function end(){
      if(!active){return;}
      active=false;tarea.style.transition='transform .2s ease';
      if(drag){ swipeSuprime=true;setTimeout(function(){swipeSuprime=false;},350);
        if(cur>max*0.4){ eliminar(id); return; } }
      reset();
    }
    tarea.addEventListener('pointerup',end);
    tarea.addEventListener('pointercancel',function(){active=false;drag=false;tarea.style.transition='';reset();});
  });
}
function eliminar(id){
  var t=porId(id);if(!t)return;
  var idx=0;U().tareas.forEach(function(x,i){if(x.id===id)idx=i;});
  var copia={};for(var k in t)copia[k]=t[k];
  /* si la tarea tenia evento propio en el calendario del telefono, se borra tambien */
  if(t.calEv&&!t.calImp&&calLibre())try{cdpNotificaciones.calBorrar(t.calEv,function(){},function(){});}catch(e){}
  U().tareas=U().tareas.filter(function(x){return x.id!==id;});
  if(UIf.id===id)resetForm();
  guardar();render();
  snackbar('Tarea eliminada','Deshacer',function(){
    /* revivir: si su evento del calendario se borro, syncCal lo vuelve a crear */
    copia.calEv='';copia.calUpd='';
    var ts2=U().tareas;
    ts2.splice(Math.min(Math.max(idx,0),ts2.length),0,copia);
    guardar();render();toast('Tarea recuperada ✔');
  });
}

/* tarjetas del dashboard: pulsar largo (250ms) para entrar en modo mover, × para quitar.
   Usamos touch events (no pointer) porque en Android/Cordova los pointer events + setPointerCapture
   fallan: al mantener pulsado el navegador empieza a scrollear y el timer se cancela.
   Las tarjetas son <div role=button>: un <button> HTML no se puede arrastrar en Android. */
var dashDrag=null,dashTimer=null,dashStart=null,dashEdit=false,dashBloqueo=0,dashUltimoBtn=null,dashEditTs=0;
/* reajusta qué tarjeta ocupa todo el ancho cuando el número es impar */
function dashWide(){
  var g=document.querySelector('.stats');if(!g)return;
  var c=[].slice.call(g.querySelectorAll('.k'));
  var medias=c.filter(function(n){return !n.classList.contains('kcustom');});
  var ultima=medias[medias.length-1];
  c.forEach(function(n){n.classList.toggle('wide',n===ultima&&medias.length%2===1);});
}
/* mueve UNA tarjeta una posición a la izquierda (-1) o a la derecha (+1) */
function dashMover(k,dir){
  var arr=(S.ui.dash||[]).slice(),i=arr.indexOf(k);
  if(i<0)return;
  var j=i+(+dir||0);
  if(j<0||j>=arr.length){toast(dir<0?'Ya es la primera tarjeta':'Ya es la última tarjeta');return;}
  var t=arr[i];arr[i]=arr[j];arr[j]=t;
  S.ui.dash=arr;guardar();
  var grid=document.querySelector('.stats');if(!grid)return;
  var card=grid.querySelector('.k[data-dash="'+k+'"]');if(!card)return;
  var otros=[].filter.call(grid.querySelectorAll('.k'),function(c){return c!==card;});
  grid.insertBefore(card,otros[j]||null);
  dashWide();
}
/* terminar la edición sin repintar: las tarjetas se quedan tal cual y el orden ya está guardado */
function salirEdicionDash(aviso){
  if(!dashEdit)return;
  dashEdit=false;
  var g=document.querySelector('.stats');if(g)g.classList.remove('edit');
  var hint=document.querySelector('.dash-hint');if(hint)hint.classList.remove('on');
  var ed=$('dashEdit');if(ed)ed.textContent='Editar';
  guardar();
  if(aviso)toast('Resumen guardado');
}
function enlazarDash(){
  var ed=$('dashEdit');
  if(ed)ed.addEventListener('click',function(){dashEdit=!dashEdit;render();});
  var da=$('dashAll');
  if(da)da.addEventListener('click',function(){S.ui.dashAll=!S.ui.dashAll;guardar();render();});
  var rs=$('dashRestore');
  if(rs)rs.addEventListener('click',function(){
    S.ui.dash=Object.keys(DASH_DEFS);dashEdit=false;guardar();render();toast('Tarjetas restauradas');});
  var addb=$('dashAdd');
  if(addb)addb.addEventListener('click',function(){
    var faltan=Object.keys(DASH_DEFS).filter(function(k){return (S.ui.dash||[]).indexOf(k)<0;});
    if(!faltan.length){toast('Ya están todas las tarjetas');return;}
    hojaOpciones('Añadir tarjeta',faltan.map(function(k){
      return {t:DASH_DEFS[k].ico+' '+DASH_DEFS[k].lbl,cb:function(){
        var arr=(S.ui.dash||[]).slice();if(arr.indexOf(k)<0)arr.push(k);
        S.ui.dash=arr;guardar();render();toast('Tarjeta añadida');}};
    }));
  });
  /* un toque fuera del resumen (saludo, lista, línea de tiempo, menú…) termina la
     edición y deja las tarjetas como están. Se instala una sola vez. */
  if(!enlazarDash.fuera){
    enlazarDash.fuera=true;
    document.addEventListener('click',function(e){
      if(!dashEdit)return;
      if(Date.now()-(dashEditTs||0)<450)return; /* el clic fantasma del pulsar-largo no cuenta */
      var t=e.target;
      if(t&&t.closest&&t.closest('.stats,.dash-hint,#dashEdit,#overlay,.toast'))return;
      salirEdicionDash(true);
    });
  }
  var grid=document.querySelector('.stats');if(!grid)return;
  function entrarEdicion(){
    if(dashEdit)return;
    dashEdit=true;dashEditTs=Date.now();render();toast('Arrastra o usa ‹ › · toca × para quitar');
  }
  /* Borrado: enganchado al botón (no al grid) y con dos candados para que un solo
     toque quite UNA tarjeta y no la vecina que se desliza al hueco:
       - e.preventDefault() en touchend: mata el click sintético duplicado.
       - dashUltimoBtn: ignora cualquier click "fantasma" que llegue a otro botón
         sin un touchstart nuevo por medio. */
  grid.querySelectorAll('[data-dash-del]').forEach(function(btn){
    function borrar(e){
      if(e){if(e.cancelable)e.preventDefault();e.stopPropagation();}
      if(btn.__borrado)return;
      if(dashUltimoBtn&&dashUltimoBtn!==btn)return;
      btn.__borrado=true;dashUltimoBtn=btn;
      quitarTarjeta(btn.getAttribute('data-dash-del'));
    }
    btn.addEventListener('touchend',borrar,{passive:false});
    btn.addEventListener('click',borrar);
  });
  grid.addEventListener('touchstart',function(){dashUltimoBtn=null;},true);
  grid.addEventListener('mousedown',function(){dashUltimoBtn=null;},true);
  grid.addEventListener('click',function(e){
    var mv=e.target.closest('[data-dash-mv]');
    if(mv){e.preventDefault();e.stopPropagation();
      dashMover(mv.getAttribute('data-dash-mv'),+mv.getAttribute('data-dir'));return;}
    var card=e.target.closest('.k');if(!card||!card.closest('.stats'))return;
    if(dashEdit)return; /* en modo edición la tarjeta no abre su hoja */
    var act=card.getAttribute('data-a');if(!act)return;
    var ACTS={hojaHoy:hojaHoy,hojaManana:hojaManana,hojaInd:hojaInd,
      hojaDelegadas:hojaDelegadas,hojaRevisar:hojaRevisar,
      hojaRiesgo:hojaRiesgo,hojaSinResp:hojaSinResp,hojaEquipo:hojaEquipo};
    if(ACTS[act])ACTS[act]();
  });
  /* más cercana al dedo (ignorando la que se arrastra) */
  function masCercana(tx,ty,el){
    var mejor=null,dmin=1e9;
    [].forEach.call(grid.querySelectorAll('.k'),function(c){
      if(c===el)return;
      var r=c.getBoundingClientRect();
      var cx=r.left+r.width/2,cy=r.top+r.height/2;
      var d=(cx-tx)*(cx-tx)+(cy-ty)*(cy-ty);
      if(d<dmin){dmin=d;mejor=c;}
    });
    return mejor;
  }
  grid.addEventListener('touchstart',function(e){
    var card=e.target.closest('.k');if(!card||!card.closest('.stats'))return;
    if(e.target.closest('[data-dash-del]')||e.target.closest('[data-dash-mv]'))return;
    var t=e.touches[0];if(!t)return;
    if(dashEdit){ /* en modo edición: agarrar para reordenar */
      dashDrag={el:card,x:t.clientX,y:t.clientY,activo:false};
      return;
    }
    /* la edicion entra SOLO con el boton Editar: mantener pulsado ya no activa nada */
    dashStart={x:t.clientX,y:t.clientY};
  },{passive:true});
  grid.addEventListener('touchmove',function(e){
    var t=e.touches[0];if(!t)return;
    if(dashDrag){ /* reordenando: intercambia con la tarjeta más cercana */
      var dx=t.clientX-dashDrag.x,dy=t.clientY-dashDrag.y;
      if(!dashDrag.activo){
        if(dx*dx+dy*dy<64)return;
        dashDrag.activo=true;
        dashDrag.ox=t.clientX;dashDrag.oy=t.clientY;
        dashDrag.el.classList.add('dragging');
        grid.classList.add('reordenando');
        [].forEach.call(grid.querySelectorAll('.k'),function(c){c.classList.remove('wide');});
      }
      e.preventDefault();
      /* la tarjeta sigue al dedo mientras se arrastra */
      dashDrag.el.style.transform='translate('+(t.clientX-dashDrag.ox)+'px,'+(t.clientY-dashDrag.oy)+'px) scale(1.03)';
      var otro=masCercana(t.clientX,t.clientY,dashDrag.el);
      if(otro&&otro!==dashDrag.el){
        /* solo cambia cuando el dedo entra en el nucleo de la otra tarjeta:
           evita el intercambio a toda velocidad al rozarla de pasada */
        var r=otro.getBoundingClientRect();
        var margenX=r.width*0.25,margenY=r.height*0.25;
        var dentro=(t.clientX>=r.left+margenX&&t.clientX<=r.right-margenX&&
                    t.clientY>=r.top+margenY&&t.clientY<=r.bottom-margenY);
        if(dentro){
          var cards=[].slice.call(grid.querySelectorAll('.k'));
          var from=cards.indexOf(dashDrag.el),to=cards.indexOf(otro);
          if(from<to)grid.insertBefore(dashDrag.el,otro.nextSibling);
          else grid.insertBefore(dashDrag.el,otro);
        }
      }
      return;
    }
  },{passive:false});
  function finToque(){
    if(dashTimer){clearTimeout(dashTimer);dashTimer=null;}
    if(!dashDrag)return;
    var d=dashDrag;dashDrag=null;
    d.el.classList.remove('dragging');
    d.el.style.transform='';
    grid.classList.remove('reordenando');
    if(!d.activo){dashWide();return;} /* fue un toque, no un arrastre */
    var ids=[];
    grid.querySelectorAll('.k').forEach(function(n){ids.push(n.getAttribute('data-dash'));});
    S.ui.dash=ids;guardar();dashWide();toast('Orden guardado');
  }
  grid.addEventListener('touchend',finToque);
  grid.addEventListener('touchcancel',finToque);
}
function quitarTarjeta(k){
  if(Date.now()<dashBloqueo)return; /* mismo toque: evita el disparo doble */
  var arr=(S.ui.dash||[]).slice();
  var i=arr.indexOf(k);if(i<0)return;
  arr.splice(i,1);
  S.ui.dash=arr;
  guardar();
  dashBloqueo=Date.now()+240;
  if(!arr.length){dashEdit=false;render();toast('Sin tarjetas · restáuralas cuando quieras');return;}
  /* quita SOLO esa tarjeta del DOM (sin repintar todo): no salta el scroll ni tiembla el resto */
  var card=document.querySelector('.stats .k[data-dash="'+k+'"]');
  if(card){
    card.classList.add('saliendo');
    setTimeout(function(){
      if(card.parentNode)card.parentNode.removeChild(card);
      dashWide();
    },160);
  }
  toast('Tarjeta quitada');
}

function exportar(){
  var data=JSON.stringify({usuario:S.sesion,datos:U()},null,2);
  var nombre='tareas-'+S.sesion+'-'+hoyISO()+'.json';
  var api=(window.cordova&&cordova.plugins&&cordova.plugins.safMediastore)||window.SafMediastore||null;
  if(api&&api.saveFile){
    carga('Elige dónde guardar…');
    /* el plugin SAF espera los datos en base64: si se le pasa el JSON en crudo
       lo decodifica como base64 y el fichero sale corrupto (y luego no se importa) */
    api.saveFile({data:b64Utf8(data),filename:nombre}).then(function(){
      cargaOff();toast('Guardado ✔ elegiste la ubicación');
    }).catch(function(e){
      cargaOff();
      var m=String((e&&e.message)||e);
      if(/cancel|-1|canceled/i.test(m))toast('Exportación cancelada');
      else {toast('No se pudo guardar aquí');descargaFichero(nombre,data);}
    });
  } else {
    carga('Preparando copia…',700);
    setTimeout(function(){descargaFichero(nombre,data);},760);
  }
}
function b64Utf8(s){
  try{
    if(typeof TextEncoder!=='undefined'){
      var by=new TextEncoder().encode(s),b='';
      for(var i=0;i<by.length;i++)b+=String.fromCharCode(by[i]);
      return btoa(b);
    }
  }catch(e){}
  return btoa(unescape(encodeURIComponent(s)));
}
function descargaFichero(nombre,data){
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
  setTimeout(function(){toast('Tus tareas exportadas');},500);
}
function importar(f){
  var r=new FileReader();
  r.onload=function(){
    var txt=String(r.result||'');
    if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1); /* BOM */
    txt=txt.trim();
    if(!txt){toast('El fichero está vacío');return;}
    var d;
    try{d=JSON.parse(txt);}catch(e){toast('El fichero no es un JSON válido');return;}
    var datos=(d&&d.datos)?d.datos:d;
    if(!datos||typeof datos!=='object'){toast('El fichero no tiene datos');return;}
    if(!Array.isArray(datos.tareas)&&datos.usuarios){ /* export de otra versión */
      var k=Object.keys(datos.usuarios)[0];
      if(k)datos=datos.usuarios[k];
    }
    if(!datos||!Array.isArray(datos.tareas)){toast('El fichero no tiene la lista de tareas');return;}
    confirmar('Importar tareas','Reemplazar TUS tareas por las del fichero ('+datos.tareas.length+' tareas). Esto no se puede deshacer.',
      {icono:'📥',ic:'info',si:'Importar',siCls:'ok'},function(ok){
        if(!ok)return;
        U().tareas=datos.tareas;U().responsables=datos.responsables||[];
        U().seq=datos.seq||(U().tareas.length+1);U().rseq=datos.rseq||(U().responsables.length+1);
        /* guardar ANTES de cargar(): cargar() relee del almacenamiento y
           deshacía la importación (volvía a dejar las tareas viejas) */
        guardar();cargar();render();toast('Tareas importadas');
      });

/* configuración del dashboard (Ajustes): checkboxes + arrastre para reordenar */
(function(){
  function refrescarDashCfg(){
    var cfg=$('dash-config');if(!cfg)return;
    cfg.querySelectorAll('.k[data-dash-cfg="1"]').forEach(function(card){
      var k=card.getAttribute('data-dash');
      var on=(S.ui.dash||[]).indexOf(k)>=0;
      card.querySelector('input[data-dash-cfg]').checked=on;
    });
  }
  document.addEventListener('click',function(e){
    var cb=e.target.closest('input[data-dash-cfg]');if(!cb)return;
    var k=cb.getAttribute('data-dash-cfg');
    var arr=(S.ui.dash||[]).slice();
    if(cb.checked){ if(arr.indexOf(k)<0)arr.push(k); }
    else { var i=arr.indexOf(k); if(i>=0)arr.splice(i,1); }
    if(!arr.length)arr=Object.keys(DASH_DEFS);
    S.ui.dash=arr;guardar();refrescarDashCfg();toast('Configuración guardada');
  });
  /* arrastre en el panel de Ajustes (misma lógica que en la vista Hoy) */
  var cfgGrid=null;
  function bindCfg(){
    cfgGrid=$('dash-config');if(!cfgGrid)return;
    cfgGrid.addEventListener('touchstart',function(e){
      var t=e.touches[0];if(!t)return;
      var card=t.target.closest('.k');if(!card||!card.closest('#dash-config'))return;
      if(t.target.closest('input'))return;
      e.preventDefault();
      dashTimer=setTimeout(function(){
        dashTimer=null;
        if(!card.closest('#dash-config'))return;
        dashDrag={el:card};
        card.classList.add('dragging');
        cfgGrid.querySelectorAll('.k').forEach(function(n){n.style.transition='transform .12s ease';});
        cfgGrid.classList.add('editable');
      },250);
      dashStart={x:t.clientX,y:t.clientY};
    },{passive:false});
    cfgGrid.addEventListener('touchmove',function(e){
      if(dashTimer){
        var t=e.touches[0];if(!t)return;
        var dx=t.clientX-dashStart.x,dy=t.clientY-dashStart.y;
        if(dx*dx+dy*dy>100){clearTimeout(dashTimer);dashTimer=null;return;}
      }
      if(!dashDrag||!dashDrag.el.closest('#dash-config'))return;
      var t2=e.touches[0];if(!t2)return;
      var over=document.elementFromPoint(t2.clientX,t2.clientY);
      var card=over&&over.closest('.k');
      if(card&&card!==dashDrag.el&&card.closest('#dash-config')){
        var r=card.getBoundingClientRect();
        var before=(t2.clientY-r.top)<r.height/2;
        try{ if(before)cfgGrid.insertBefore(dashDrag.el,card);
              else cfgGrid.insertBefore(dashDrag.el,card.nextSibling);}catch(err){}
      }
      e.preventDefault();
    },{passive:false});
    cfgGrid.addEventListener('touchend',function(e){
      if(dashTimer){clearTimeout(dashTimer);dashTimer=null;return;}
      if(!dashDrag)return;
      dashDrag.el.classList.remove('dragging');
      cfgGrid.querySelectorAll('.k').forEach(function(n){n.style.transition='';});
      cfgGrid.classList.remove('editable');
      var ids=[];
      cfgGrid.querySelectorAll('.k').forEach(function(n){ids.push(n.getAttribute('data-dash'));});
      S.ui.dash=ids;guardar();refrescarDashCfg();toast('Orden guardado');
      dashDrag=null;
    });
    cfgGrid.addEventListener('click',function(e){
      if(dashDrag){dashDrag=null;return;}
      var b=e.target.closest('[data-dash-del]');if(!b)return;
      e.stopPropagation();
      var k=b.getAttribute('data-dash-del');
      var arr=(S.ui.dash||[]).slice();
      var i=arr.indexOf(k);if(i>=0){arr.splice(i,1);if(!arr.length)arr=Object.keys(DASH_DEFS);S.ui.dash=arr;guardar();render();toast('Tarjeta quitada');}
    });
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('#dash-config')||e.target.closest('.stats'))return;
  });
  /* re-vincular cuando se renderiza Ajustes */
  var _render=render;
  render=function(anim){ _render(anim); if(S&&S.sesion&&S.ui.vista==='ajustes'){ setTimeout(bindCfg,30); } };
})();
  /* gancho de automatizacion/depuracion (neutral en produccion) */
  try{window.__DBG={S:function(){return S;},U:function(){return U();},guardar:guardar,render:render,cargar:cargar,parseNatural:parseNatural,choquesDeDia:choquesDeDia,conflictoDe:conflictoDe,proximaHoraLibre:proximaHoraLibre,cargaDia:cargaDia,crearRapido:crearRapido,repOcurre:repOcurre,enfoqueTareas:function(h){return enfoqueTareas(h);},ordenarMiDia:ordenarMiDia,kanbanHTML:kanbanHTML,kanbanMueve:kanbanMueve,marcarEstado:marcarEstado,repHechoHoy:repHechoHoy,kanbanSuelta:kanbanSuelta,eliminar:eliminar,copiasBackup:copiasBackup,restaurarCopia:restaurarCopia,pomodoroIniciar:pomodoroIniciar,leerCompartido:leerCompartido,tareasDeDia:function(f){return tareasDeDia(f);},POM:function(){return POM;},chequearAct:chequearAct}}catch(e){}
})();
